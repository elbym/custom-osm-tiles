<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karte</title>
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
html, body { margin: 0; } #map { height: 100dvh; }
/* Blasen-Marker (Standard-Stile): Label im abgerundeten Kasten, Stiel und Punkt auf der Position (wie der Terminal-Marker,
   damit das Ziel frei bleibt) */
.bubble { display: flex; flex-direction: column; align-items: center; font: 600 14px/1.2 system-ui, sans-serif; }
.bubble .box { background: var(--bg); color: var(--fg); border: 2px solid var(--c1); border-radius: 8px; padding: 6px 10px; white-space: nowrap; box-shadow: 0 2px 6px rgb(0 0 0 / .3); }
.bubble .stem { width: 2px; height: 14px; background: var(--c1); }
.bubble .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c1); box-shadow: 0 0 0 3px var(--bg); }
/* Terminal-Marker (Nerd-Stile): Kästchen mit Prompt und (statischem) Block-Cursor, Stiel und Punkt auf der Position */
.term { display: flex; flex-direction: column; align-items: center; font: 600 13px/1 ui-monospace, "JetBrains Mono", "Fira Code", monospace; }
.term .box { background: var(--bg); color: var(--fg); border: 1.5px solid var(--c1); border-radius: 4px; padding: 5px 8px; white-space: nowrap; box-shadow: 0 2px 6px rgb(0 0 0 / .45); }
.term .p { color: var(--c2); }
.term .cur { display: inline-block; width: .6em; height: 1.05em; margin-left: .35em; background: var(--c1); vertical-align: -2px; }
.term .stem { width: 2px; height: 12px; background: var(--c1); }
/* overlay im Stil: über Kacheln und Marker, unter den Bedienelementen. Kopie in src/streifen.css (.ov-*), gleich halten.
   crt (Phosphor, Bernstein): Scanlines und Vignette, Mitte leicht in der Markerfarbe (--glow) glühend. */
.ov-crt::after { content: ""; position: absolute; inset: 0; z-index: 650; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgb(0 0 0 / .3) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, color-mix(in srgb, var(--glow, #50ff78) 8%, transparent), transparent 55%, rgb(0 0 0 / .6)); }
.term .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c1); box-shadow: 0 0 0 3px var(--bg); }
/* 8 Bit (--pixel): Terminal-Marker im Pixelraster, --u = ein 8-Bit-Pixel; Schrift Silkscreen (8 Schriftpixel Geviert),
   keine Rundungen, harter Schatten. Kopie in src/streifen.css, gleich halten. */
@font-face { font-family: "Silkscreen"; src: url("silkscreen.ttf"); }
.term.px { font: calc(var(--u) * 8)/calc(var(--u) * 6) Silkscreen, monospace; -webkit-font-smoothing: none; }
.term.px .box { border: var(--u) solid var(--c1); border-radius: 0; padding: var(--u) calc(var(--u) * 2); box-shadow: var(--u) var(--u) 0 rgb(0 0 0 / .5); }
.term.px .p svg { display: inline-block; width: calc(var(--u) * 12); height: calc(var(--u) * 5); vertical-align: baseline; }
.term.px .cur { width: calc(var(--u) * 4); height: calc(var(--u) * 5); margin-left: var(--u); vertical-align: top; }
.term.px .stem { width: var(--u); height: calc(var(--u) * 3); }
.term.px .dot { width: calc(var(--u) * 2); height: calc(var(--u) * 2); border-radius: 0; box-shadow: 0 0 0 var(--u) var(--bg); }
</style>
</head>
<body>
<div id="map"></div>
<script src="leaflet/leaflet.js"></script>
<script>
const c = /*CONFIG*/{};
// 8-Bit (--pixel): hochskalierte Kacheln (Leaflet-Zoom über die gerenderten Stufen) ohne Glättung zeigen
if (c.overlay) { const m = document.getElementById('map'); m.classList.add('ov-' + c.overlay); m.style.setProperty('--glow', c.marker?.color); }
if (c.pixel) document.head.appendChild(document.createElement('style')).textContent = '.leaflet-tile { image-rendering: pixelated; }';
const map = L.map('map', {
  minZoom: c.zmin, maxZoom: c.zmax,
  maxBounds: c.bounds, maxBoundsViscosity: 1
}).setView([c.lat, c.lon], Math.min(c.zmax, c.detail_from - 1));
const ext = c.ext || 'webp';
const url = c.retina ? `tiles/{z}/{x}/{y}{r}.${ext}` : `tiles/{z}/{x}/{y}.${ext}`;
// Übersicht: über detail_from-1 hinaus hochskaliert, damit außerhalb des Detailbereichs nichts leer bleibt
L.tileLayer(url, {
  maxNativeZoom: Math.min(c.zmax, c.detail_from - 1), bounds: c.bounds,
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap-Mitwirkende</a>, © OpenMapTiles' + (c.attribution ? ', ' + c.attribution : '')
}).addTo(map);
// Detail: echte Kacheln ab detail_from, nur um den Marker
if (c.zmax >= c.detail_from) L.tileLayer(url, { minZoom: c.detail_from, bounds: c.detail }).addTo(map);
const marker = L.marker([c.lat, c.lon], { icon: markerIcon(c.marker, c.pixel), title: c.marker?.label }).addTo(map);
if (c.pixel) { snapMarker(marker, c.pixel, Math.min(c.zmax, c.detail_from - 1)); map.on('zoomend', () => snapMarker(marker, c.pixel, Math.min(c.zmax, c.detail_from - 1))); }

// 8 Bit: Marker so verschieben, dass seine Pixel auf den Kachelpixeln liegen (Raster = pixel * 2^Hochskalierung)
function snapMarker(mk, px, native) {
  const g = px * 2 ** Math.max(0, map.getZoom() - native), el = mk.getElement()?.firstChild;
  if (!el) return;
  const a = mk.options.icon.options.iconAnchor, p = map.project(mk.getLatLng()).round();
  const m = v => ((v % g) + g) % g;
  el.style.translate = `${-m(p.x - a[0])}px ${-m(p.y - a[1])}px`;
}

// Marker laut Stil: "bubble" (Standard-Stile), "terminal" (Nerd-Stile) oder der Leaflet-Standard; beide mit Stiel und Punkt
function markerIcon(m, px) {
  const PX_PROMPT = '<svg viewBox="0 0 12 5" fill="currentColor" shape-rendering="crispEdges"><rect x="1" y="2" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/><rect x="0" y="3" width="1" height="1"/><rect x="2" y="3" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="10" y="0" width="1" height="1"/><rect x="9" y="1" width="1" height="1"/><rect x="8" y="2" width="1" height="1"/><rect x="7" y="3" width="1" height="1"/><rect x="6" y="4" width="1" height="1"/></svg>';  // 8 Bit: ~/ als Pixelgrafik (Silkscreen-Tilde sitzt zu hoch, / zu rund)
  if (m?.type === 'bubble') {
    const el = document.createElement('div');
    el.className = 'bubble';
    for (const [k, v] of Object.entries({ c1: m.color, bg: m.bg, fg: m.fg })) el.style.setProperty('--' + k, v);
    el.innerHTML = '<span class="box"></span><span class="stem"></span><span class="dot"></span>';
    el.querySelector('.box').textContent = m.label;  // Text, kein HTML
    document.body.appendChild(el); const w = el.offsetWidth, h = el.offsetHeight; el.remove();
    return L.divIcon({ className: '', html: el, iconSize: [w, h], iconAnchor: [Math.round(w / 2), h - 4] });
  }
  if (m?.type !== 'terminal') return new L.Icon.Default();
  const el = document.createElement('div');
  el.className = px ? 'term px' : 'term';
  for (const [k, v] of Object.entries({ c1: m.color, c2: m.color2, bg: m.bg, fg: m.fg, u: px + 'px' })) el.style.setProperty('--' + k, v);
  el.innerHTML = '<span class="box"><span class="p">~/</span><span class="t"></span><span class="cur"></span></span><span class="stem"></span><span class="dot"></span>';
  el.querySelector('.t').textContent = m.label;  // Text, kein HTML
  if (px) el.querySelector('.p').innerHTML = PX_PROMPT;
  // Größe messen, damit der Punkt (unten Mitte) genau auf der Position liegt
  document.body.appendChild(el); const w = el.offsetWidth, h = el.offsetHeight; el.remove();
  return L.divIcon({ className: '', html: el, iconSize: [w, h], iconAnchor: [Math.round(w / 2), h - (px || 4)] });
}
// In compare.html (iframe): Ausschnitt mit der anderen Karte synchron halten
if (parent !== window) {
  let syncing = false;  // setView ohne Animation feuert moveend sofort: nicht zurückschicken
  map.on('moveend', () => { if (!syncing) parent.postMessage({ center: map.getCenter(), zoom: map.getZoom() }, '*'); });
  addEventListener('message', e => { syncing = true; map.setView(e.data.center, e.data.zoom, { animate: false }); syncing = false; });
}
</script>
</body>
</html>
