# Öffentliche Vorschau (GitHub Pages): ./make-tiles.py --site  ->  site/
# Eine Karte in Streifen, je Stil ein Streifen; Schriften je Gruppe wählbar.

# Köln (seit 2026-11-27: Bielefeld ist zu flach, die Hologramm-Stile brauchen Hochhäuser)
# area = "koeln-regbez"      # Geofabrik-Extrakt (Köln liegt im Regierungsbezirk Köln)
# lat = 50.9413              # Kölner Dom
# lon = 6.9583
# label = "Kölner Dom"       # Text im Marker

# Bielefeld (bis 2026-11-27)
area = "detmold-regbez"    # Geofabrik-Extrakt (Bielefeld liegt im Regierungsbezirk Detmold)
lat = 52.0320              # SchücoArena, Bielefeld
lon = 8.5168               # Stadion laut OSM (Nominatim)
label = "SchücoArena"      # Text im Marker
zoom = "15-17"
radius = 1.2               # km um den Mittelpunkt; kleiner Ausschnitt rund um den Marker (Kacheln: mindestens
                           # ein viewport, siehe tiles_for(); größere Fenster sind dann nicht mehr verschiebbar)
viewport = "1920x1920"     # größte Kartengröße; quadratisch, damit Hoch- und Querformat gefüllt sind
retina = true              # @2x zusätzlich; bei 1,2 km Radius ca. 350–400 MB (Pages-Limit 1 GB)
exclude = ["OSM", "Americana", "Papier", "Cupertino", "Protomaps",   # Familien nur in der README-Galerie,
           "One", "Everforest", "Gruvbox", "Photon Dev", "Holotisch", "Hologramm",
           "Wiki", "Kupferstich", "Tokyo Night", "Catppuccin", "Solarized", "North", "Marke"]               # nicht auf der öffentlichen Vorschau
pixel = ["Phosphor", "Neon Cyberpunk", "Cyberspace"]   # diese Gruppen/Familien zusätzlich im 8-Bit-Modus (--pixel 4, Schrift Silkscreen), Schalter "8 Bit"

[fonts]                    # Schriften je Stil-Gruppe (category)
standard = ["Fira Sans"]  # eine Schrift je Gruppe (= preview_font der Stile), halbiert die Renderzeit
nerd = ["Maple Mono"]
