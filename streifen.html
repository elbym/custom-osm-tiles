<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Stile in Streifen</title>
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; }
  #map { position: absolute; inset: 0; background: #888; }
  #titles { position: absolute; inset: 0 0 auto 0; z-index: 1000; display: flex; pointer-events: none; }
  #titles div { flex: 1; padding: .3rem .5rem; background: rgb(255 255 255 / .85); border-left: 1px solid #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #titles div.none { color: #777; font-style: italic; }
  #bar { position: absolute; top: 2.2rem; left: .5rem; z-index: 1000; display: flex; gap: .5rem; align-items: center;
         background: rgb(255 255 255 / .9); padding: .3rem .4rem; border-radius: 4px; box-shadow: 0 1px 4px rgb(0 0 0 / .3); }
  .seg { display: inline-flex; border: 1px solid #888; border-radius: 4px; overflow: hidden; }
  .seg button { border: 0; padding: .2rem .6rem; background: #fff; font: inherit; cursor: pointer; }
  .seg button + button { border-left: 1px solid #888; }
  .seg button[aria-pressed="true"] { background: #333; color: #fff; }
  select { font: inherit; padding: .1rem; }
  /* Terminal-Marker (Nerd-Stile): Kästchen mit Prompt und Block-Cursor, Stiel und Punkt auf der Position */
  .term { display: flex; flex-direction: column; align-items: center; font: 600 13px/1 ui-monospace, "JetBrains Mono", "Fira Code", monospace; }
  .term .box { background: var(--bg); color: var(--fg); border: 1.5px solid var(--c1); border-radius: 4px; padding: 5px 8px; white-space: nowrap; box-shadow: 0 2px 6px rgb(0 0 0 / .45); }
  .term .p { color: var(--c2); }
  .term .cur { display: inline-block; width: .6em; height: 1.05em; margin-left: .35em; background: var(--c1); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  .term .stem { width: 2px; height: 12px; background: var(--c1); }
  .term .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c1); box-shadow: 0 0 0 3px var(--bg); }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .term .cur { animation: none; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="titles"></div>
<div id="bar">
  <span class="seg" id="cat"><button value="standard">Standard</button><button value="nerd">Nerd</button></span>
  <span class="seg" id="mode"><button value="light">Hell</button><button value="dark">Dunkel</button></span>
  <select id="font" title="Schrift für alle Streifen"></select>
</div>
<script src="variants.js"></script>
<script src="leaflet/leaflet.js"></script>
<script>
// Eine Karte, ein Streifen pro Stil-Familie der gewählten Gruppe (?cat=standard|nerd) im gewählten Modus
// (?mode=light|dark), alle in derselben Schrift (?font=…). Jeder Stil ist eine Kachelebene in einem eigenen
// Pane, das per clip-path auf seinen Streifen beschnitten wird. Familien ohne diesen Modus bleiben leer.
const q = new URLSearchParams(location.search);
const all = Object.entries(CONFIGS);
const cat = q.get('cat') === 'nerd' ? 'nerd' : 'standard';
const mode = q.get('mode') === 'dark' ? 'dark' : 'light';
const inSet = c => c.category === cat && c.mode === mode;
const fonts = [...new Set(all.filter(([, c]) => inSet(c)).map(([, c]) => c.font))].sort();
const font = fonts.includes(q.get('font')) ? q.get('font') : fonts[0];
const families = [...new Set(all.filter(([, c]) => c.category === cat).map(([, c]) => c.family))].sort();
const strips = families.map(fam => [fam, all.find(([, c]) => inSet(c) && c.family === fam && c.font === font)]);

const go = (key, val) => { q.set(key, val); location.search = q; };
for (const [id, val] of [['cat', cat], ['mode', mode]]) {
  for (const b of document.querySelectorAll(`#${id} button`)) {
    b.setAttribute('aria-pressed', b.value === val);
    b.onclick = () => go(id, b.value);
  }
}
const sel = document.getElementById('font');
sel.innerHTML = fonts.map(f => `<option${f === font ? ' selected' : ''}>${f}</option>`).join('');
sel.onchange = () => go('font', sel.value);

const c0 = (strips.find(([, v]) => v)?.[1] || all[0])[1];
const map = L.map('map', {
  minZoom: c0.zmin, maxZoom: c0.zmax, maxBounds: c0.bounds, maxBoundsViscosity: 1, zoomControl: false
}).setView([c0.lat, c0.lon], Math.min(c0.zmax, c0.detail_from - 1));
L.control.zoom({ position: 'bottomleft' }).addTo(map);
map.attributionControl.addAttribution('© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap-Mitwirkende</a>, © OpenMapTiles');

const panes = strips.map(([, v], i) => {
  const pane = map.createPane('strip' + i);
  pane.style.zIndex = 200 + i;
  if (!v) return pane;
  const [name, c] = v;
  const url = name + (c.retina ? '/tiles/{z}/{x}/{y}{r}.webp' : '/tiles/{z}/{x}/{y}.webp');
  L.tileLayer(url, { pane: 'strip' + i, maxNativeZoom: Math.min(c.zmax, c.detail_from - 1), bounds: c.bounds }).addTo(map);
  if (c.zmax >= c.detail_from) L.tileLayer(url, { pane: 'strip' + i, minZoom: c.detail_from, bounds: c.detail }).addTo(map);
  if (c.attribution) map.attributionControl.addAttribution(c.attribution);
  return pane;
});
// Marker im Stil des mittleren Streifens (dort liegt er beim Öffnen); Nerd-Stile: Terminal-Marker
const mid = strips[Math.floor(strips.length / 2)][1] || strips.find(([, v]) => v)[1];
L.marker([c0.lat, c0.lon], { icon: markerIcon(mid?.[1].marker), title: mid?.[1].marker?.label }).addTo(map);

// Streifen-Zuschnitt: Panes liegen im verschobenen mapPane, daher dessen Position abziehen
function clip() {
  const size = map.getSize(), pos = L.DomUtil.getPosition(map.getPane('mapPane')), n = panes.length;
  panes.forEach((pane, i) => {
    const x0 = size.x * i / n - pos.x, x1 = size.x * (i + 1) / n - pos.x, y0 = -pos.y, y1 = size.y - pos.y;
    pane.style.clipPath = `polygon(${x0}px ${y0}px, ${x1}px ${y0}px, ${x1}px ${y1}px, ${x0}px ${y1}px)`;
  });
}
map.on('move zoom viewreset resize', clip);
clip();

// Kopfzeile: Stilname je Streifen, bzw. Hinweis, wenn die Familie diesen Modus nicht hat
const head = document.getElementById('titles');
for (const [fam, v] of strips) {
  const cell = head.appendChild(document.createElement('div'));
  if (v) cell.textContent = TITLES[v[0]].split(' · ')[0];
  else {
    const hasMode = all.some(([, c]) => inSet(c) && c.family === fam);
    cell.textContent = hasMode ? `${fam}: nicht in ${font} gerendert` : `${fam}: nur ${mode === 'dark' ? 'hell' : 'dunkel'}`;
    cell.className = 'none';
  }
}



// Marker laut Stil: "terminal" (Nerd-Stile) oder der Leaflet-Standard
function markerIcon(m) {
  if (m?.type !== 'terminal') return new L.Icon.Default();
  const el = document.createElement('div');
  el.className = 'term';
  for (const [k, v] of Object.entries({ c1: m.color, c2: m.color2, bg: m.bg, fg: m.fg })) el.style.setProperty('--' + k, v);
  el.innerHTML = '<span class="box"><span class="p">~/</span><span class="t"></span><span class="cur"></span></span><span class="stem"></span><span class="dot"></span>';
  el.querySelector('.t').textContent = m.label;  // Text, kein HTML
  // Größe messen, damit der Punkt (unten Mitte) genau auf der Position liegt
  document.body.appendChild(el); const w = el.offsetWidth, h = el.offsetHeight; el.remove();
  return L.divIcon({ className: '', html: el, iconSize: [w, h], iconAnchor: [w / 2, h - 4] });
}
// In compare.html (iframe): Ausschnitt mit der anderen Karte synchron halten
if (parent !== window) {
  let syncing = false;  // setView ohne Animation feuert moveend sofort: nicht zurückschicken
  map.on('moveend', () => { if (!syncing) parent.postMessage({ center: map.getCenter(), zoom: map.getZoom() }, '*'); });
  addEventListener('message', e => { syncing = true; map.setView(e.data.center, e.data.zoom, { animate: false }); syncing = false; });
}
</script>
</body>
</html>
