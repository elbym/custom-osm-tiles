# "Bluecron" (Arbeitstitel): eigener Stil im Look von Tron, dunkel; seit 2026-11-26 näher an Tron Legacy (Nutzerwunsch):
#   - Grund dunkles Petrol wie der Dunst im Film, darüber ein leuchtendes Bodengitter (Muster "gitter", weltfest)
#   - Flächennutzung durchsichtig, damit das Gitter überall durchscheint; Grün nur als petrolfarbener Hauch
#   - Gebäude als Drahtgitter: dunkles Glas mit leuchtender Cyan-Kante
#   - Hauptstraßen weißglühender Kern mit cyanfarbenem Leuchtschein (Lichtrenner-Spur), Nebenstraßen dünnes Cyan
#   - Autobahn Orange als einzige Gegenfarbe (die "andere Seite"), Wasser schwarz mit Cyan-Uferlinie
#   - Unterschied zu Neon Cyberpunk: kein Pink, kein Violett im Grund, dafür Gebäudekanten
title = "Bluecron"
category = "nerd"      # standard | nerd (Gruppe in der Vorschau)
mode = "dark"          # light | dark
family = "Bluecron"          # gleiche Familie = Gegenstück beim Hell/Dunkel-Umschalten
order = 97
font = "Mozilla Text"
preview_font = "Maple Mono"   # Schrift für die Vorschau (--all)
site_font = "Mozilla Text"   # öffentliche Vorschau (--site); ohne: Schrift der Gruppe aus site.toml
fonts = ["sans", "mono"]   # Schriftgruppen für --all-fonts
text_scale = 1.1
hide = ["poi_r20", "road_oneway*"]

[paint."background"]
background-pattern = "gitter"
background-color = "#06171c"
[paint."landuse-*"]
fill-color = "#06171c"
fill-opacity = 0
[paint."park"]
fill-color = "#0c2a2a"
fill-opacity = 0.6
[paint."landcover-*"]
fill-color = "#0c2a2a"
fill-opacity = 0.6
[paint."landuse-cemetery"]
fill-color = "#0c2a2a"
fill-opacity = 0.6

[paint."water*"]
fill-color = "#020b0f"
line-color = "#2bc4e8"

# Drahtgitter: Glasfläche, Kante in Cyan
[paint."building*"]
fill-color = "#0a2028"
fill-outline-color = "#2a9fb8"   # Glaskante, heller als vorher (Legacy: Kanten leuchten)

# Straßen: weißglühender Kern, Ränder als Leuchtschein (line-blur) in Cyan, Autobahn Orange
[paint."*-minor*"]
line-color = "#1a6a7e"
[paint."*-service-track"]
line-color = "#124e5e"
[paint."*-link"]
line-color = "#2bc4e8"
[paint."*-secondary-tertiary*"]
line-color = "#2bc4e8"
[paint."*-primary*"]
line-color = "#e6fbff"
[paint."*-trunk*"]
line-color = "#e6fbff"
[paint."*-motorway*"]
line-color = "#ffb066"
[paint."*-casing"]
line-color = "#06171c"
[paint."*-secondary-tertiary*-casing"]
line-color = "#2bc4e8"   # Leuchtschein
line-blur = 2
line-opacity = 0.35
[paint."*-primary*-casing"]
line-color = "#3fd8ff"   # Leuchtschein
line-blur = 4
line-opacity = 0.75
[paint."*-trunk*-casing"]
line-color = "#3fd8ff"   # Leuchtschein
line-blur = 4
line-opacity = 0.75
[paint."*-motorway*-casing"]
line-color = "#ff8a1f"   # Leuchtschein
line-blur = 4
line-opacity = 0.8
[paint."highway-area"]             # Fußgängerzonen, Plätze
fill-color = "#0b2630"
fill-outline-color = "#2a9fb8"
[paint."aeroway-*"]
fill-color = "#0a1e24"
line-color = "#0a1e24"
[paint."*-path"]
line-color = "#1a7f99"
[paint."*railway*"]
line-color = "#3a5866"
[paint."road_area_pier"]
fill-color = "#06171c"
[paint."road_pier"]
line-color = "#06171c"

# Ortsnamen weiß mit Cyan-Schein, Straßennamen helles Cyan, POIs in der Markerfarbe
[paint."label_*"]
text-color = "#eafcff"
text-halo-color = "#0b5f78"
text-halo-width = 2
text-halo-blur = 2
[paint."highway-name-*"]
text-color = "#9fe8fa"
text-halo-color = "#06171c"
[paint."poi_*"]
text-color = "#3fd8ff"
text-halo-color = "#06171c"
[paint."water*label"]
text-color = "#2bc4e8"

# >>> Marker
# Terminal-Marker: Kästchen "~/<--label>" mit Block-Cursor, Stiel und Punkt auf der Position
[marker]
type = "terminal"   # leaflet | terminal
color = "#3fd8ff"      # Rahmen, Cursor, Stiel
color2 = "#ffb066"     # Prompt ~/
bg = "#06171c"
fg = "#eafcff"
# <<< Marker

# Bodengitter (vendor/patterns/gitter.svg): Linie in gedämpftem Cyan auf dem Petrolgrund
[patterns]
gitter = { symbol = "gitter", color = "#11495a", bg = "#06171c" }   # gedämpft, damit Gebäude und Straßen vorn bleiben
