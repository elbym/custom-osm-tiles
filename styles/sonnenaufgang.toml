[marker]
type = "bubble"
color = "#f0902a"
bg = "#3e3f5e"
fg = "#fff3e4"

# >>> Licht aus Osten (Nutzerwunsch 2026-11-26): die Sonne steht tief im Osten (rechts). Hochhäuser werfen lange Schatten
# nach Westen, je höher, desto länger (fill-translate kennt keine Daten-Ausdrücke, daher drei Höhenklassen); auf dem
# Dach (Nutzerwunsch 2026-11-26): die Ostkante leuchtet (helle Kopie nach Osten, darüber das Dach wieder dunkel, es
# bleibt ein heller Rand), dann sechs schwache Kopien je 1 px weiter östlich: zur Kante hin hell, nach Westen ein Verlauf.
