# "Holotisch Tag" (Arbeitstitel, Entwurf, Nutzerwunsch 2026-11-27): heller Partner von Holotisch, der Kartentisch bei
# Tageslicht:
#   - Grund kühles helles Blaugrau, dasselbe Geländeraster wie Holotisch ([holo.terrain]) in kühlem Blau
#   - Gebäude im selben Durchgang (holo_light(), by = "height"), aber blend = "folie": halbtransparente Glasblöcke, die
#     den Grund einfärben, niedrig blau, hoch petrol bis grün und deckender (fill_top)
#   - Straßen als korallrotes Datennetz ohne Leuchtschein, Nebenstraßen hellblau
#   - Haltestellen als weiße Knoten mit rotem Ring; nur Orts- und Stadtteilnamen in dunklem Marineblau
title = "Holotisch Tag"
category = "nerd"
mode = "light"
family = "Holotisch"
order = 95
attribution = "Höhendaten: Terrain Tiles (AWS Open Data); Europe terrain data produced using Copernicus data and information funded by the European Union - EU-DEM layers; SRTM and GMTED2010 terrain data courtesy of the U.S. Geological Survey"
font = "Maple Mono"
preview_font = "Maple Mono"
site_font = "Maple Mono"
fonts = ["sans", "mono"]
text_scale = 1.05
colors = 64
hide = ["poi_*", "airport", "road_oneway*", "building-top", "highway-name-*", "*shield*", "water*label"]

[paint."background"]
background-color = "#e3edf5"
[paint."landuse-*"]
fill-color = "#e3edf5"
fill-opacity = 0
[paint."park"]
fill-color = "#cfe6e6"
fill-opacity = 0.6
[paint."landcover-*"]
fill-color = "#cfe6e6"
fill-opacity = 0.6
[paint."landuse-cemetery"]
fill-color = "#cfe6e6"
fill-opacity = 0.6

[paint."water*"]
fill-color = "#c5d9ea"
line-color = "#7fa8cc"

[paint."building"]
fill-color = "#d5e3ee"
fill-outline-color = "#d5e3ee"

[paint."*-minor*"]
line-color = "#a9c4d8"
[paint."*-service-track"]
line-color = "#bcd2e2"
line-opacity = 0.6
[paint."*-link"]
line-color = "#d0506c"
line-width = ["interpolate", ["exponential", 1.4], ["zoom"], 10, 0.3, 16, 0.8, 18, 1.4]
[paint."*-secondary-tertiary*"]
line-color = "#c0506a"
line-width = ["interpolate", ["exponential", 1.4], ["zoom"], 10, 0.3, 16, 0.8, 18, 1.4]
[paint."*-primary*"]
line-color = "#d8304e"
line-width = ["interpolate", ["exponential", 1.4], ["zoom"], 10, 0.4, 16, 1.2, 18, 2]
[paint."*-trunk*"]
line-color = "#d8304e"
line-width = ["interpolate", ["exponential", 1.4], ["zoom"], 10, 0.4, 16, 1.2, 18, 2]
[paint."*-motorway*"]
line-color = "#c0203e"
line-width = ["interpolate", ["exponential", 1.4], ["zoom"], 10, 0.5, 16, 1.6, 18, 2.6]
[paint."*-casing"]
line-opacity = 0
[paint."highway-area"]
fill-color = "#d8e6f0"
fill-outline-color = "#a9c4d8"
[paint."aeroway-*"]
fill-color = "#d8e6f0"
line-color = "#d8e6f0"
[paint."*-path"]
line-color = "#a0bed4"
[paint."*railway*"]
line-color = "#b07890"
[paint."road_area_pier"]
fill-color = "#e3edf5"
[paint."road_pier"]
line-color = "#e3edf5"

[layout."label_*"]
text-transform = "uppercase"
text-letter-spacing = 0.2
[paint."label_*"]
text-color = "#0d3a5c"
text-halo-color = "#e3edf5"
text-halo-width = 2
text-halo-blur = 0

[paint."poi_*"]   # ausgeblendet; die Farbe braucht nur poi_sprite()
text-color = "#0f6e9e"

[marker]
type = "terminal"
color = "#0f6e9e"
color2 = "#d8304e"
bg = "#e3edf5"
fg = "#0a2238"

# Knoten im Datennetz: weiße Punkte mit rotem Ring, der Schein nur schwach (auf hellem Grund ein Hof statt Leuchten)
[[layers]]
source-layer = "poi"
like = "poi_transit"
type = "circle"
after = "highway-motorway"
id = "knoten-schein"
filter = ["in", ["get", "class"], ["literal", ["bus", "railway", "tram"]]]
minzoom = 14
paint = { circle-color = "#d8304e", circle-radius = 6, circle-blur = 1, circle-opacity = 0.3 }
[[layers]]
source-layer = "poi"
like = "poi_transit"
type = "circle"
after = "knoten-schein"
id = "knoten"
filter = ["in", ["get", "class"], ["literal", ["bus", "railway", "tram"]]]
minzoom = 14
paint = { circle-color = "#ffffff", circle-radius = 2, circle-stroke-color = "#d8304e", circle-stroke-width = 1.2 }

# >>> Gebäude-Durchgang (holo_light(), Regler siehe hologramm.toml/holotisch.toml); blend = "folie": Farbfilter statt
# Aufhellen. Verlauf gesättigt und eher dunkel, helle Töne wie Holotischs Mint würden als Filter verschwinden.
# Durchsichtiger wie Holotisch (2026-11-27): Kanten unten 20 % (edge_low), Fläche unten dünner, oben wie bisher.
[holo]
blend = "folie"
by = "height"
colors = ["#3a7ad8", "#1e9ad0", "#10a8b0", "#10a880", "#0a8a5a"]
hmax = 30
slices = 10
lean = 1.0
angle = 12
spread = 15
shimmer = 0.6
fill = 0.033
fill_top = 9
fringe = 1000
edge = 0.6
edge_low = 0.2
bloom = 0.3
bloom_r = 5
glitch = 0.01
glitch_px = 4
aberration = 0
# Geländeraster statt Hintergrundmuster (Nutzerwunsch 2026-11-27, terrain_grid() in make-tiles.py): Linien um die
# Geländehöhe über der Umgebung nach oben versetzt (scale Weltpixel je m, Höhen aus Terrain Tiles, relief_m = Radius der
# Umgebung), auf bebauten Flächen flach, damit die Stadt mit den Gebäuden nicht noch unruhiger wird
[holo.terrain]
blend = "overlay"   # Screen kann nur aufhellen und verschwände auf dem hellen Tisch; Overlay dunkelt helle Stellen ab
color = "#0a2a6a"
cell = 16
width = 0.7
glow = 0.25
glow_width = 1.6
scale = 0.25
max_px = 40
angle = 12
relief_m = 2500
fade = 20
pad_m = 25
# Unregelmäßigkeit (Nutzerwunsch 2026-11-27, "Differenz-Wolken", Vorbilder Partikelraster und Raster mit Leuchtknoten):
# Deckung nach |fbm1 - fbm2| (clouds = Stärke, cloud_scale Weltpixel, cloud_gain), in schwachen Zonen Partikel statt
# Linie (sparkle); Segmente seg_low … 1 hell, Anteil lit voll mit Schein; Knoten als Lichtpunkte, Anteil nodes hell
# (node_glow = Schein); Anteil cells der Zellen schwach gefüllt (cell_fill); Werte wie Holotisch außer clouds
clouds = 0.6   # schwächer als Holotisch: Overlay auf hellem Grund wirkt ohnehin zart, sonst verschwände das Raster
cloud_scale = 300
cloud_gain = 3.5
sparkle = 0.8
seg_low = 0.35
lit = 0.06
nodes = 0.08
node_glow = 1.5
star_color = "#04184a"   # Leuchtpunkte als vierstrahliger Stern (star_kernel()), heller als das Raster
star_r = 9
cells = 0.04
cell_fill = 0.12
# <<<
