# Nightfox: Kartenstil nach dem Editor-Theme Nightfox (https://github.com/EdenEast/nightfox.nvim, MIT).
# Farben aus der Palette des Themes; dunkel.
title = "Nightfox"
category = "nerd"      # standard | nerd (Gruppe in der Vorschau)
mode = "dark"          # light | dark
family = "Nightfox"          # gleiche Familie = Gegenstück beim Hell/Dunkel-Umschalten
font = "Fira Sans"
preview_font = "Maple Mono"   # Schrift für die Vorschau (--all)
fonts = ["sans", "serif", "mono"]   # Schriftgruppen für --all
text_scale = 1.15
attribution = "Farben nach Nightfox (MIT)"
hide = ["poi_r20", "road_oneway*"]

# Neon (dunkle Nerd-Stile): Haupt-/Fernstraßen und Autobahn fast in voller Akzentfarbe, ihre Ränder
# in derselben Farbe weichgezeichnet (line-blur) als Leuchtschein; Wasser leuchtender. Markiert mit "# Neon".
[paint."background"]
background-color = "#192330"
[paint."landuse-*"]
fill-color = "#161e2a"
fill-opacity = 1
# Grünflächen in der Signaturfarbe des Themes: Cyan (#63cdcf), mit dem Grund gemischt
[paint."park"]
fill-color = "#284550"
[paint."landcover-*"]
fill-color = "#284550"
fill-opacity = 1
[paint."landcover-wood"]
fill-color = "#2e535d"
[paint."landuse-cemetery"]
fill-color = "#284550"

[paint."water*"]
fill-color = "#3e7880"   # Neon
line-color = "#45898f"

[paint."building*"]
fill-color = "#212e3f"
fill-outline-color = "#29394f"

# Straßen: Füllung zuerst, Ränder danach (später stehende Muster gewinnen)
[paint."*-minor*"]
line-color = "#39506d"
[paint."*-service-track"]
line-color = "#39506d"
[paint."*-link"]
line-color = "#39506d"
[paint."*-secondary-tertiary*"]
line-color = "#556a84"
[paint."*-primary*"]
line-color = "#6890c5"   # Neon
[paint."*-trunk*"]
line-color = "#6890c5"   # Neon
[paint."*-motorway*"]
line-color = "#e99c5f"   # Neon
[paint."*-casing"]
line-color = "#0d1219"
[paint."*-secondary-tertiary*-casing"]
line-color = "#0d1219"
[paint."*-primary*-casing"]
line-color = "#719cd6"   # Neon-Leuchtschein
line-blur = 3
line-opacity = 0.55
[paint."*-trunk*-casing"]
line-color = "#719cd6"   # Neon-Leuchtschein
line-blur = 3
line-opacity = 0.55
[paint."*-motorway*-casing"]
line-color = "#f4a261"   # Neon-Leuchtschein
line-blur = 4
line-opacity = 0.6
[paint."highway-area"]             # Fußgängerzonen, Plätze
fill-color = "#29394f"
fill-outline-color = "#29394f"
[paint."aeroway-*"]
fill-color = "#29394f"
line-color = "#29394f"
[paint."*-path"]
line-color = "#71839b"
[paint."*railway*"]
line-color = "#738091"
[paint."road_area_pier"]
fill-color = "#192330"
[paint."road_pier"]
line-color = "#192330"

[paint."*label*"]
text-color = "#cdcecf"
text-halo-color = "#192330"
[paint."label_*"]
text-color = "#cdcecf"
text-halo-color = "#192330"
[paint."highway-name-*"]
text-color = "#aeafb0"
text-halo-color = "#192330"
[paint."poi_*"]
text-color = "#aeafb0"
text-halo-color = "#192330"
[paint."poi_transit"]
text-color = "#63cdcf"
[paint."water*label"]
text-color = "#719cd6"
[paint."airport"]
text-color = "#aeafb0"
text-halo-color = "#192330"

# >>> Akzent-Beschriftung
# Straßennummern ohne weißes Schild (Sprite-Bild, nicht umfärbbar), stattdessen in den Akzentfarben des Themes:
# Autobahn #f4a261, Bundes-/Hauptstraße #719cd6, Land-/Kreisstraße #63cdcf. Hauptstraßennamen ebenfalls #719cd6.
[layout."*shield*"]
icon-image = ""
text-size = 12
[paint."*shield*"]
text-color = ["match", ["get", "class"], "motorway", "#f4a261", ["trunk", "primary"], "#719cd6", "#63cdcf"]
text-halo-color = "#192330"
text-halo-width = 1.5
[paint."highway-name-major"]
text-color = "#719cd6"
# <<< Akzent-Beschriftung

# >>> Marker
# Terminal-Marker: Kästchen "~/<--label>" mit blinkendem Block-Cursor, Stiel und Punkt auf der Position
[marker]
type = "terminal"   # leaflet | terminal
color = "#719cd6"      # Rahmen, Cursor, Stiel
color2 = "#63cdcf"     # Prompt ~/
bg = "#192330"
fg = "#cdcecf"
# <<< Marker
