# Nightfox: Kartenstil nach dem Editor-Theme Nightfox (https://github.com/EdenEast/nightfox.nvim, MIT).
# Farben aus der Palette des Themes; dunkel.
title = "Nightfox"
category = "nerd"      # standard | nerd (Gruppe in der Vorschau)
mode = "dark"          # light | dark
family = "Nightfox"          # gleiche Familie = Gegenstück beim Hell/Dunkel-Umschalten
font = "Fira Sans"
preview_font = "Maple Mono"   # Schrift für die Vorschau (--all)
site_font = "Cascadia Code"   # öffentliche Vorschau (--site); ohne: Schrift der Gruppe aus site.toml
fonts = ["sans", "serif", "mono"]   # Schriftgruppen für --all
text_scale = 1.15
attribution = "Farben nach Nightfox (MIT)"
hide = ["poi_r20", "road_oneway*"]

# Charakter: gedämpftes, kühles Marineblau ohne Leuchtschein. Orange (Autobahn) ist der einzige warme Akzent,
# Cyan bleibt den Grünflächen und der Wasserbeschriftung vorbehalten.
[paint."background"]
background-color = "#192330"
[paint."landuse-*"]
fill-color = "#161e2a"
fill-opacity = 1
# Grünflächen in der Signaturfarbe des Themes: Cyan (#63cdcf), mit dem Grund gemischt
[paint."park"]
fill-color = "#284550"
[paint."landcover-*"]
fill-color = "#284550"
fill-opacity = 1
[paint."landcover-wood"]
fill-color = "#2e535d"
[paint."landuse-cemetery"]
fill-color = "#284550"

# Wasser tief in Nightfox-Blue (#719cd6), 30 % mit dem Grund gemischt; Flüsse 40 %
[paint."water*"]
fill-color = "#334762"
line-color = "#3c5372"

[paint."building*"]
fill-color = "#212e3f"
fill-outline-color = "#29394f"

# Straßen: Füllung zuerst, Ränder danach (später stehende Muster gewinnen)
[paint."*-minor*"]
line-color = "#29394f"
[paint."*-service-track"]
line-color = "#29394f"
[paint."*-link"]
line-color = "#29394f"
[paint."*-secondary-tertiary*"]
line-color = "#3c5372"
[paint."*-primary*"]
line-color = "#719cd6"
[paint."*-trunk*"]
line-color = "#719cd6"
[paint."*-motorway*"]
line-color = "#f4a261"
[paint."*-casing"]
line-color = "#131a24"
[paint."*-secondary-tertiary*-casing"]
line-color = "#131a24"
[paint."highway-area"]             # Fußgängerzonen, Plätze
fill-color = "#29394f"
fill-outline-color = "#29394f"
[paint."aeroway-*"]
fill-color = "#29394f"
line-color = "#29394f"
[paint."*-path"]
line-color = "#71839b"
[paint."*railway*"]
line-color = "#738091"
[paint."road_area_pier"]
fill-color = "#192330"
[paint."road_pier"]
line-color = "#192330"

# Orts- und POI-Namen in der Akzentfarbe des Markers (#719cd6, mit Text/Grund gemischt für Kontrast)
[paint."*label*"]
text-color = "#719cd6"
text-halo-color = "#192330"
[paint."label_*"]
text-color = "#719cd6"
text-halo-color = "#192330"
[paint."highway-name-*"]
text-color = "#aeafb0"
text-halo-color = "#192330"
[paint."poi_*"]
text-color = "#5e81b1"
text-halo-color = "#192330"
[paint."poi_transit"]
text-color = "#63cdcf"
[paint."water*label"]
text-color = "#719cd6"
[paint."airport"]
text-color = "#5e81b1"
text-halo-color = "#192330"

# >>> Akzent-Beschriftung
# Straßennummern ohne weißes Schild (Sprite-Bild, nicht umfärbbar), stattdessen in den Akzentfarben des Themes:
# Autobahn #f4a261, Bundes-/Hauptstraße #719cd6, Land-/Kreisstraße #63cdcf. Hauptstraßennamen ebenfalls #719cd6.
[layout."*shield*"]
icon-image = ""
text-size = 12
[paint."*shield*"]
text-color = ["match", ["get", "class"], "motorway", "#f4a261", ["trunk", "primary"], "#719cd6", "#63cdcf"]
text-halo-color = "#192330"
text-halo-width = 1.5
[paint."highway-name-major"]
text-color = "#719cd6"
# <<< Akzent-Beschriftung

# >>> Marker
# Terminal-Marker: Kästchen "~/<--label>" mit blinkendem Block-Cursor, Stiel und Punkt auf der Position
[marker]
type = "terminal"   # leaflet | terminal
color = "#719cd6"      # Rahmen, Cursor, Stiel
color2 = "#63cdcf"     # Prompt ~/
bg = "#192330"
fg = "#cdcecf"
# <<< Marker
