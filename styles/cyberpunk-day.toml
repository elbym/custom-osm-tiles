# Cyberpunk Day: helles Gegenstück zu Neon Cyberpunk (eigener Entwurf; die Vorlage maptoposter hat keine helle
# Variante). "Synthwave bei Tag": reine Neonfarben Magenta/Cyan, Straßen mit farbigem, weichgezeichnetem
# Schein statt dunkler Kante, Nebenstraßen als schwach leuchtende Cyan-Drähte. Der Grund ist leicht lavendel
# getönt, weil ein Schein auf reinem Weiß verpufft. Orts- und Hauptstraßennamen mit leuchtender Kontur.
title = "Cyberpunk Day"
category = "nerd"      # standard | nerd (Gruppe in der Vorschau)
mode = "light"          # light | dark
family = "Neon Cyberpunk"          # gleiche Familie = Gegenstück beim Hell/Dunkel-Umschalten
order = 99             # Reihenfolge der Streifen: höher = weiter rechts (Standard 50)
font = "Maple Mono"
preview_font = "Maple Mono"   # Schrift für die Vorschau (--all)
fonts = ["sans", "serif", "mono"]   # Schriftgruppen für --all-fonts
text_scale = 1.15
attribution = "Farben nach maptoposter Neon Cyberpunk (MIT), helle Variante"
hide = ["poi_r20", "road_oneway*"]

[paint."background"]
background-color = "#eee8fa"           # Lavendel getönt (3)
[paint."landuse-*"]
fill-color = "#e9e2f7"
fill-opacity = 1
[paint."park"]
fill-color = "#fbb6ee"                 # Pink
[paint."landcover-*"]
fill-color = "#fbb6ee"
fill-opacity = 1
[paint."landcover-wood"]
fill-color = "#f79be6"
[paint."landuse-cemetery"]
fill-color = "#fbb6ee"

[paint."water*"]
fill-color = "#9ef3ff"                 # Neon-Cyan (6)
line-color = "#5eeaff"

[paint."building*"]
fill-color = "#e3dcf4"
fill-outline-color = "#d4caee"

# Straßen: Füllung zuerst, Ränder danach (später stehende Muster gewinnen)
[paint."*-minor*"]
line-color = "#ffffff"
[paint."*-service-track"]
line-color = "#ffffff"
[paint."*-link"]
line-color = "#ffffff"
[paint."*-secondary-tertiary*"]
line-color = "#ffffff"
[paint."*-primary*"]
line-color = "#00e5ff"                 # reines Neon-Cyan (1)
[paint."*-trunk*"]
line-color = "#00e5ff"
[paint."*-motorway*"]
line-color = "#ff00e6"                 # reines Neon-Magenta (1)
# Ränder als Leuchtschein in der Straßenfarbe (2); Nebenstraßen als schwach leuchtende Cyan-Drähte (5)
[paint."*-casing"]
line-color = "#00e5ff"
line-blur = 1.5
line-opacity = 0.4
[paint."*-secondary-tertiary*-casing"]
line-color = "#00e5ff"
line-blur = 2.5
line-opacity = 0.5
[paint."*-primary*-casing"]
line-color = "#00e5ff"
line-blur = 4
line-opacity = 0.55
[paint."*-trunk*-casing"]
line-color = "#00e5ff"
line-blur = 4
line-opacity = 0.55
[paint."*-motorway*-casing"]
line-color = "#ff00e6"
line-blur = 5
line-opacity = 0.6
[paint."highway-area"]                 # Fußgängerzonen, Plätze
fill-color = "#ffffff"
fill-outline-color = "#ffffff"
[paint."aeroway-*"]
fill-color = "#ffffff"
line-color = "#ffffff"
[paint."*-path"]
line-color = "#00c8e0"
[paint."*railway*"]
line-color = "#9a8fc4"
[paint."road_area_pier"]
fill-color = "#eee8fa"
[paint."road_pier"]
line-color = "#eee8fa"

# Orts- und POI-Namen in der Akzentfarbe des Markers (#d000c8, mit Text/Grund gemischt für Kontrast).
# Leuchtende Kontur (4) nur für Orts- und Hauptstraßennamen; kleine Straßennamen bleiben ohne Schein lesbar.
[paint."*label*"]
text-color = "#d000c8"
text-halo-color = "#ffffff"
[paint."label_*"]
text-color = "#b000a8"
text-halo-color = "rgba(0, 229, 255, 0.55)"  # Cyan-Schein
text-halo-width = 2.5
text-halo-blur = 1.5
[paint."highway-name-*"]
text-color = "#2b2b45"
text-halo-color = "#ffffff"
[paint."highway-name-major"]
text-color = "#a3009d"                 # Hauptstraßennamen in Magenta
text-halo-color = "rgba(255, 0, 230, 0.4)"   # Pink-Schein
text-halo-width = 2
text-halo-blur = 1.5
[paint."poi_*"]
text-color = "#8c058b"
text-halo-color = "#ffffff"
[paint."poi_transit"]
text-color = "#00737f"
[paint."water*label"]
text-color = "#00737f"
[paint."airport"]
text-color = "#8c058b"
text-halo-color = "#ffffff"

# Straßennummern ohne weißes Schild: Autobahn Magenta, Bundes-/Hauptstraße Cyan, sonst Petrol
[layout."*shield*"]
icon-image = ""
text-size = 12
[paint."*shield*"]
text-color = ["match", ["get", "class"], "motorway", "#a3009d", ["trunk", "primary"], "#00737f", "#4f6f80"]
text-halo-color = "#ffffff"
text-halo-width = 1.5

# Terminal-Marker: weiß hinterlegt, Magenta-Rahmen, Cyan-Prompt
[marker]
type = "terminal"
color = "#d000c8"
color2 = "#00a5b5"
bg = "#ffffff"
fg = "#0d0d1a"
