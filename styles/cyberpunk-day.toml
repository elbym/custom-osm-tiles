# Cyberpunk Day: helles Gegenstück zu Neon Cyberpunk (eigener Entwurf; die Vorlage maptoposter hat keine helle
# Variante). "Warnfarben": Neon braucht dunklen Grund, also lebt die helle Variante von Sättigung und hartem
# Kontrast statt Schein. Kräftig gelber Grund, Pink/Cyan als Akzente, schwarze Tuschekanten, kein Glow.
title = "Cyberpunk Day"
category = "nerd"      # standard | nerd (Gruppe in der Vorschau)
mode = "light"          # light | dark
family = "Neon Cyberpunk"          # gleiche Familie = Gegenstück beim Hell/Dunkel-Umschalten
order = 99             # Reihenfolge der Streifen: höher = weiter rechts (Standard 50)
font = "Maple Mono"
preview_font = "Maple Mono"   # Schrift für die Vorschau (--all)
site_font = "Space Mono"   # öffentliche Vorschau (--site); ohne: Schrift der Gruppe aus site.toml
fonts = ["sans", "serif", "mono"]   # Schriftgruppen für --all-fonts
text_scale = 1.15
attribution = "Farben nach maptoposter Neon Cyberpunk (MIT), helle Variante"
hide = ["poi_r20", "road_oneway*"]

[paint."background"]
background-color = "#fff59a"           # Warngelb
[paint."landuse-*"]
fill-color = "#fbec80"
fill-opacity = 1
[paint."park"]
fill-color = "#ffa3d4"                 # Pink
[paint."landcover-*"]
fill-color = "#ffa3d4"
fill-opacity = 1
[paint."landcover-wood"]
fill-color = "#ff80c3"
[paint."landuse-cemetery"]
fill-color = "#ffa3d4"

[paint."water*"]
fill-color = "#5ef0ff"                 # Neon-Cyan
line-color = "#00b8d0"

[paint."building*"]
fill-color = "#fffbd6"
fill-outline-color = "#e6cf55"

# Straßen: Füllung zuerst, Ränder danach (später stehende Muster gewinnen)
[paint."*-minor*"]
line-color = "#ffffff"
[paint."*-service-track"]
line-color = "#ffffff"
[paint."*-link"]
line-color = "#ffffff"
[paint."*-secondary-tertiary*"]
line-color = "#ffffff"
[paint."*-primary*"]
line-color = "#00e5ff"                 # Neon-Cyan
[paint."*-trunk*"]
line-color = "#00e5ff"
[paint."*-motorway*"]
line-color = "#ff2e97"                 # Neon-Pink
# Ränder als schwarze Tusche, ohne Schein
[paint."*-casing"]
line-color = "#111111"
line-opacity = 1
[paint."highway-area"]                 # Fußgängerzonen, Plätze
fill-color = "#ffffff"
fill-outline-color = "#111111"
[paint."aeroway-*"]
fill-color = "#ffffff"
line-color = "#ffffff"
[paint."*-path"]
line-color = "#111111"
[paint."*railway*"]
line-color = "#111111"
[paint."road_area_pier"]
fill-color = "#fff59a"
[paint."road_pier"]
line-color = "#fff59a"

# Beschriftung: schwarz, Orte und POIs in tiefem Pink, Halo im Grundgelb
[paint."*label*"]
text-color = "#111111"
text-halo-color = "#fff59a"
[paint."label_*"]
text-color = "#c4006a"
text-halo-color = "#fff59a"
text-halo-width = 2
text-halo-blur = 0
[paint."highway-name-*"]
text-color = "#111111"
text-halo-color = "#ffffff"
[paint."highway-name-major"]
text-color = "#111111"
text-halo-color = "#00e5ff"            # Halo in der Straßenfarbe
text-halo-width = 2
text-halo-blur = 0
[paint."poi_*"]
text-color = "#9e0057"
text-halo-color = "#fff59a"
[paint."poi_transit"]
text-color = "#006b78"
[paint."water*label"]
text-color = "#006b78"
[paint."airport"]
text-color = "#9e0057"
text-halo-color = "#fff59a"

# Straßennummern ohne weißes Schild: Autobahn Pink, Bundes-/Hauptstraße Petrol, sonst schwarz
[layout."*shield*"]
icon-image = ""
text-size = 12
[paint."*shield*"]
text-color = ["match", ["get", "class"], "motorway", "#c4006a", ["trunk", "primary"], "#006b78", "#111111"]
text-halo-color = "#ffffff"
text-halo-width = 1.5

# Terminal-Marker: schwarz auf Gelb, Pink-Prompt
[marker]
type = "terminal"
color = "#111111"
color2 = "#c4006a"
bg = "#fff59a"
fg = "#111111"
