# Tokyo Night: Kartenstil nach dem Editor-Theme Tokyo Night (https://github.com/folke/tokyonight.nvim, Apache-2.0).
# Farben aus der Palette des Themes; dunkel.
title = "Tokyo Night"
category = "nerd"      # standard | nerd (Gruppe in der Vorschau)
mode = "dark"          # light | dark
family = "Tokyo Night"          # gleiche Familie = Gegenstück beim Hell/Dunkel-Umschalten
font = "JetBrains Mono"
preview_font = "Maple Mono"   # Schrift für die Vorschau (--all)
fonts = ["sans", "serif", "mono"]   # Schriftgruppen für --all
text_scale = 1.15
attribution = "Farben nach Tokyo Night (Apache-2.0)"
hide = ["poi_r20", "road_oneway*"]

# Neon (Dracula, Tokyo Night, Cyberpunk): Haupt-/Fernstraßen und Autobahn fast in voller Akzentfarbe, ihre Ränder
# in derselben Farbe weichgezeichnet (line-blur) als Leuchtschein. Markiert mit "# Neon".
# Charakter: Tokio bei Nacht. Haupt-/Fernstraßen in Blue (#7aa2f7), Autobahn in Magenta2 (#ff007c),
# Wasser in Blue0 (#3d59a1), Grünflächen Neon-Pink.
[paint."background"]
background-color = "#1a1b26"
[paint."landuse-*"]
fill-color = "#181822"
fill-opacity = 1
# Grünflächen in der Signaturfarbe des Themes: Neon-Pink (#ff007c), mit dem Grund gemischt
[paint."park"]
fill-color = "#481637"
[paint."landcover-*"]
fill-color = "#481637"
fill-opacity = 1
[paint."landcover-wood"]
fill-color = "#5a133e"
[paint."landuse-cemetery"]
fill-color = "#481637"

# Wasser in Blue0 (#3d59a1), 75 % mit dem Grund gemischt; Flüsse voll
[paint."water*"]
fill-color = "#344a82"
line-color = "#3d59a1"

[paint."building*"]
fill-color = "#292e42"
fill-outline-color = "#414868"

# Straßen: Füllung zuerst, Ränder danach (später stehende Muster gewinnen)
[paint."*-minor*"]
line-color = "#545c7e"
[paint."*-service-track"]
line-color = "#545c7e"
[paint."*-link"]
line-color = "#545c7e"
[paint."*-secondary-tertiary*"]
line-color = "#565f89"
[paint."*-primary*"]
line-color = "#7094e2"   # Neon
[paint."*-trunk*"]
line-color = "#7094e2"   # Neon
[paint."*-motorway*"]
line-color = "#f40178"   # Neon
[paint."*-casing"]
line-color = "#0c0e14"
[paint."*-secondary-tertiary*-casing"]
line-color = "#0c0e14"
[paint."*-primary*-casing"]
line-color = "#7aa2f7"   # Neon-Leuchtschein
line-blur = 3
line-opacity = 0.55
[paint."*-trunk*-casing"]
line-color = "#7aa2f7"   # Neon-Leuchtschein
line-blur = 3
line-opacity = 0.55
[paint."*-motorway*-casing"]
line-color = "#ff007c"   # Neon-Leuchtschein
line-blur = 4
line-opacity = 0.6
[paint."highway-area"]             # Fußgängerzonen, Plätze
fill-color = "#414868"
fill-outline-color = "#414868"
[paint."aeroway-*"]
fill-color = "#414868"
line-color = "#414868"
[paint."*-path"]
line-color = "#565f89"
[paint."*railway*"]
line-color = "#737aa2"
[paint."road_area_pier"]
fill-color = "#1a1b26"
[paint."road_pier"]
line-color = "#1a1b26"

# Orts- und POI-Namen in der Akzentfarbe des Markers (#bb9af7, mit Text/Grund gemischt für Kontrast)
[paint."*label*"]
text-color = "#bb9af7"
text-halo-color = "#1a1b26"
[paint."label_*"]
text-color = "#bb9af7"
text-halo-color = "#1a1b26"
[paint."highway-name-*"]
text-color = "#a9b1d6"
text-halo-color = "#1a1b26"
[paint."poi_*"]
text-color = "#987ec9"
text-halo-color = "#1a1b26"
[paint."poi_transit"]
text-color = "#7dcfff"
[paint."water*label"]
text-color = "#7aa2f7"
[paint."airport"]
text-color = "#987ec9"
text-halo-color = "#1a1b26"

# >>> Akzent-Beschriftung
# Straßennummern ohne weißes Schild (Sprite-Bild, nicht umfärbbar), stattdessen in den Akzentfarben des Themes:
# Autobahn #ff007c, Bundes-/Hauptstraße #7aa2f7, Land-/Kreisstraße #7dcfff. Hauptstraßennamen ebenfalls #7aa2f7
# (gleiche Farben wie die Straßenlinien).
[layout."*shield*"]
icon-image = ""
text-size = 12
[paint."*shield*"]
text-color = ["match", ["get", "class"], "motorway", "#ff007c", ["trunk", "primary"], "#7aa2f7", "#7dcfff"]
text-halo-color = "#1a1b26"
text-halo-width = 1.5
[paint."highway-name-major"]
text-color = "#7aa2f7"
# <<< Akzent-Beschriftung

# >>> Marker
# Terminal-Marker: Kästchen "~/<--label>" mit blinkendem Block-Cursor, Stiel und Punkt auf der Position
[marker]
type = "terminal"   # leaflet | terminal
color = "#bb9af7"      # Rahmen, Cursor, Stiel
color2 = "#7aa2f7"     # Prompt ~/
bg = "#1a1b26"
fg = "#c0caf5"
# <<< Marker
