# Phosphor: grüner Monochrom-Röhrenbildschirm (P1-Phosphor, Terminals der 70er/80er). Eigener Entwurf.
# Alles in Helligkeitsstufen eines Grüns auf fast schwarzem Grund; Straßen und Schrift mit weichem Nachleuchten.
# Scanlines und Vignette kommen nicht aus den Kacheln, sondern als CSS-Ebene im Browser (overlay = "crt").
title = "Phosphor"
category = "nerd"      # standard | nerd (Gruppe in der Vorschau)
mode = "dark"          # light | dark
family = "Phosphor"    # gleiche Familie = Gegenstück beim Hell/Dunkel-Umschalten (hell: Endlospapier)
order = 98             # rechts, vor Neon Cyberpunk
font = "VT323"         # Bildschirmschrift der DEC-Terminals
preview_font = "VT323"
site_font = "VT323"    # öffentliche Vorschau in VT323 statt der Gruppenschrift (site.toml)
fonts = ["mono"]
text_scale = 1.15
attribution = "Eigener Entwurf nach grünen P1-Phosphor-Monitoren"
hide = ["poi_r20", "road_oneway*"]
overlay = "crt"        # Scanlines und Vignette über der Karte (template.html, Vorschau)

# Stufen: g0 #050a05 Grund · g1 #081108 Flächen · g2 #0c1d0f Grün · g3 #12301a Gebäude/Wasser
#         g4 #1f7a35 Nebenstraßen · g5 #2fb84f Straßen · g6 #3fe36a Hauptstraßen · g7 #7dffa0 Schrift
[paint."background"]
background-color = "#050a05"
[paint."landuse-*"]
fill-color = "#081108"
fill-opacity = 1
[paint."park"]
fill-color = "#0c1d0f"
[paint."landcover-*"]
fill-color = "#0c1d0f"
fill-opacity = 1
[paint."landcover-wood"]
fill-color = "#0f2513"
[paint."landuse-cemetery"]
fill-color = "#0c1d0f"

[paint."water*"]
fill-color = "#0a2614"
line-color = "#1f7a35"

[paint."building*"]
fill-color = "#0e2414"
fill-outline-color = "#1a4a26"

# Straßen: Füllung zuerst, Ränder danach (später stehende Muster gewinnen)
[paint."*-minor*"]
line-color = "#1f7a35"
[paint."*-service-track"]
line-color = "#165a28"
[paint."*-link"]
line-color = "#2fb84f"
[paint."*-secondary-tertiary*"]
line-color = "#2fb84f"
[paint."*-primary*"]
line-color = "#3fe36a"
[paint."*-trunk*"]
line-color = "#3fe36a"
[paint."*-motorway*"]
line-color = "#7dffa0"
[paint."*-casing"]
line-color = "#050a05"
# Nachleuchten: Ränder der großen Straßen grün und weichgezeichnet
[paint."*-primary*-casing"]
line-color = "#3fe36a"
line-blur = 3
line-opacity = 0.35
[paint."*-trunk*-casing"]
line-color = "#3fe36a"
line-blur = 3
line-opacity = 0.35
[paint."*-motorway*-casing"]
line-color = "#7dffa0"
line-blur = 4
line-opacity = 0.45
[paint."highway-area"]                 # Fußgängerzonen, Plätze
fill-color = "#0e2414"
fill-outline-color = "#0e2414"
[paint."aeroway-*"]
fill-color = "#0e2414"
line-color = "#0e2414"
[paint."*-path"]
line-color = "#1f7a35"
[paint."*railway*"]
line-color = "#1a4a26"
[paint."road_area_pier"]
fill-color = "#050a05"
[paint."road_pier"]
line-color = "#050a05"

# Schrift: hell mit grünem, weichem Halo = Nachleuchten
[paint."*label*"]
text-color = "#7dffa0"
text-halo-color = "#0f3d1b"
text-halo-width = 2
text-halo-blur = 2
[paint."label_*"]
text-color = "#7dffa0"
text-halo-color = "#0f3d1b"
text-halo-width = 2
text-halo-blur = 2
[paint."highway-name-*"]
text-color = "#3fe36a"
text-halo-color = "#050a05"
[paint."highway-name-major"]
text-color = "#7dffa0"
[paint."poi_*"]
text-color = "#3fe36a"
text-halo-color = "#050a05"
[paint."water*label"]
text-color = "#2fb84f"
[paint."airport"]
text-color = "#3fe36a"
text-halo-color = "#050a05"

# >>> Akzent-Beschriftung: Straßennummern ohne weißes Schild, nach Straßenklasse heller
[layout."*shield*"]
icon-image = ""
text-size = 12
[paint."*shield*"]
text-color = ["match", ["get", "class"], "motorway", "#7dffa0", ["trunk", "primary"], "#3fe36a", "#2fb84f"]
text-halo-color = "#050a05"
text-halo-width = 1.5
# <<<

[marker]
type = "terminal"
color = "#3fe36a"      # Rahmen, Cursor, Stiel
color2 = "#1f7a35"     # Prompt ~/
bg = "#050a05"
fg = "#7dffa0"
