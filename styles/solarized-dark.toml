# Solarized Dark: Kartenstil nach dem Editor-Theme Solarized (https://ethanschoonover.com/solarized, MIT).
# Farben aus der Palette des Themes; dunkel.
title = "Solarized Dark"
category = "nerd"      # standard | nerd (Gruppe in der Vorschau)
mode = "dark"          # light | dark
family = "Solarized"          # gleiche Familie = Gegenstück beim Hell/Dunkel-Umschalten
font = "JetBrains Mono"
preview_font = "Maple Mono"   # Schrift für die Vorschau (--all)
fonts = ["sans", "serif", "mono"]   # Schriftgruppen für --all
text_scale = 1.15
attribution = "Farben nach Solarized (MIT)"
hide = ["poi_r20", "road_oneway*"]

# Charakter: flach und nüchtern, kein Leuchtschein. Straßen nur über die Grundtöne base02 < base01 < base00
# abgestuft; Gelb und Orange bleiben Fernstraße und Autobahn vorbehalten.
[paint."background"]
background-color = "#002b36"
[paint."landuse-*"]
fill-color = "#002832"
fill-opacity = 1
# Grünflächen in Solarized-Yellow (#b58900): ein RGB-Mix mit dem Petrol-Grund wird grün, daher ein dunkles
# OKLCH-Gold (#4b3b13), hier zu 45 % (Wald 60 %) mit dem Grund gemischt, damit das Petrol den Streifen bestimmt
[paint."park"]
fill-color = "#223226"
[paint."landcover-*"]
fill-color = "#223226"
fill-opacity = 1
[paint."landcover-wood"]
fill-color = "#2d3521"
[paint."landuse-cemetery"]
fill-color = "#223226"

# Wasser in Solarized-Blue (#268bd2), 35 % mit dem Grund gemischt; Flüsse 45 %
[paint."water*"]
fill-color = "#0d4d6d"
line-color = "#11567c"

[paint."building*"]
fill-color = "#073642"
fill-outline-color = "#274c56"

# Straßen: Füllung zuerst, Ränder danach (später stehende Muster gewinnen)
[paint."*-minor*"]
line-color = "#274c56"
[paint."*-service-track"]
line-color = "#274c56"
[paint."*-link"]
line-color = "#274c56"
[paint."*-secondary-tertiary*"]
line-color = "#586e75"
[paint."*-primary*"]
line-color = "#b58900"
[paint."*-trunk*"]
line-color = "#b58900"
[paint."*-motorway*"]
line-color = "#cb4b16"
[paint."*-casing"]
line-color = "#002b36"
[paint."*-secondary-tertiary*-casing"]
line-color = "#002b36"
[paint."highway-area"]             # Fußgängerzonen, Plätze
fill-color = "#073642"
fill-outline-color = "#073642"
[paint."aeroway-*"]
fill-color = "#073642"
line-color = "#073642"
[paint."*-path"]
line-color = "#586e75"
[paint."*railway*"]
line-color = "#657b83"
[paint."road_area_pier"]
fill-color = "#002b36"
[paint."road_pier"]
line-color = "#002b36"

[paint."*label*"]
text-color = "#93a1a1"
text-halo-color = "#002b36"
[paint."label_*"]
text-color = "#93a1a1"
text-halo-color = "#002b36"
[paint."highway-name-*"]
text-color = "#839496"
text-halo-color = "#002b36"
[paint."poi_*"]
text-color = "#839496"
text-halo-color = "#002b36"
[paint."poi_transit"]
text-color = "#2aa198"
[paint."water*label"]
text-color = "#268bd2"
[paint."airport"]
text-color = "#839496"
text-halo-color = "#002b36"

# >>> Akzent-Beschriftung
# Straßennummern ohne weißes Schild (Sprite-Bild, nicht umfärbbar), stattdessen in den Akzentfarben des Themes:
# Autobahn #cb4b16, Bundes-/Hauptstraße #b58900, Land-/Kreisstraße #2aa198. Hauptstraßennamen ebenfalls #b58900.
[layout."*shield*"]
icon-image = ""
text-size = 12
[paint."*shield*"]
text-color = ["match", ["get", "class"], "motorway", "#cb4b16", ["trunk", "primary"], "#b58900", "#2aa198"]
text-halo-color = "#002b36"
text-halo-width = 1.5
[paint."highway-name-major"]
text-color = "#b58900"
# <<< Akzent-Beschriftung

# >>> Marker
# Terminal-Marker: Kästchen "~/<--label>" mit blinkendem Block-Cursor, Stiel und Punkt auf der Position
[marker]
type = "terminal"   # leaflet | terminal
color = "#b58900"      # Rahmen, Cursor, Stiel
color2 = "#2aa198"     # Prompt ~/
bg = "#002b36"
fg = "#93a1a1"
# <<< Marker
