# Dayfox: Kartenstil nach dem Editor-Theme Nightfox (Dayfox) (https://github.com/EdenEast/nightfox.nvim, MIT).
# Farben aus der Palette des Themes; hell.
title = "Dayfox"
category = "nerd"      # standard | nerd (Gruppe in der Vorschau)
mode = "light"          # light | dark
family = "Nightfox"          # gleiche Familie = Gegenstück beim Hell/Dunkel-Umschalten
font = "Fira Sans"
preview_font = "Maple Mono"   # Schrift für die Vorschau (--all)
fonts = ["sans", "serif", "mono"]   # Schriftgruppen für --all
text_scale = 1.15
attribution = "Farben nach Nightfox (Dayfox) (MIT)"
hide = ["poi_r20", "road_oneway*"]

[paint."background"]
background-color = "#f6f2ee"
[paint."landuse-*"]
fill-color = "#e4dcd4"
fill-opacity = 1
# Grünflächen in der Signaturfarbe des Themes: Cyan (#287980), mit dem Grund gemischt
[paint."park"]
fill-color = "#c2d4d2"
[paint."landcover-*"]
fill-color = "#c2d4d2"
fill-opacity = 1
[paint."landcover-wood"]
fill-color = "#aec8c8"
[paint."landuse-cemetery"]
fill-color = "#c2d4d2"

[paint."water*"]
fill-color = "#aeb6d6"
line-color = "#aeb6d6"

[paint."building*"]
fill-color = "#ded4ca"
fill-outline-color = "#c9c6be"   # dezente Kontur (60 % Fläche, 40 % #aab0ad)

# Straßen: Füllung zuerst, Ränder danach (später stehende Muster gewinnen)
[paint."*-minor*"]
line-color = "#ffffff"
[paint."*-service-track"]
line-color = "#ffffff"
[paint."*-link"]
line-color = "#ffffff"
[paint."*-secondary-tertiary*"]
line-color = "#ffffff"
[paint."*-primary*"]
line-color = "#dcbb9b"
[paint."*-trunk*"]
line-color = "#dcbb9b"
[paint."*-motorway*"]
line-color = "#d29498"
[paint."*-casing"]
line-color = "#aab0ad"
[paint."*-secondary-tertiary*-casing"]
line-color = "#837a72"
[paint."*-primary*-casing"]
line-color = "#be7c3d"
[paint."*-trunk*-casing"]
line-color = "#be7c3d"
[paint."*-motorway*-casing"]
line-color = "#b1414c"
[paint."highway-area"]             # Fußgängerzonen, Plätze
fill-color = "#ffffff"
fill-outline-color = "#ffffff"
[paint."aeroway-*"]
fill-color = "#ffffff"
line-color = "#ffffff"
[paint."*-path"]
line-color = "#837a72"
[paint."*railway*"]
line-color = "#837a72"
[paint."road_area_pier"]
fill-color = "#f6f2ee"
[paint."road_pier"]
line-color = "#f6f2ee"

[paint."*label*"]
text-color = "#3d2b5a"
text-halo-color = "#ffffff"
[paint."label_*"]
text-color = "#3d2b5a"
text-halo-color = "#ffffff"
[paint."highway-name-*"]
text-color = "#643f61"
text-halo-color = "#ffffff"
[paint."poi_*"]
text-color = "#643f61"
text-halo-color = "#ffffff"
[paint."poi_transit"]
text-color = "#287980"
[paint."water*label"]
text-color = "#2848a9"
[paint."airport"]
text-color = "#643f61"
text-halo-color = "#ffffff"

# >>> Akzent-Beschriftung
# Straßennummern ohne weißes Schild (Sprite-Bild, nicht umfärbbar), stattdessen in den Akzentfarben des Themes:
# Autobahn #ac5402, Bundes-/Hauptstraße #2848a9, Land-/Kreisstraße #287980. Hauptstraßennamen ebenfalls #2848a9.
[layout."*shield*"]
icon-image = ""
text-size = 12
[paint."*shield*"]
text-color = ["match", ["get", "class"], "motorway", "#ac5402", ["trunk", "primary"], "#2848a9", "#287980"]
text-halo-color = "#f6f2ee"
text-halo-width = 1.5
[paint."highway-name-major"]
text-color = "#2848a9"
# <<< Akzent-Beschriftung

# >>> Marker
# Terminal-Marker: Kästchen "~/<--label>" mit blinkendem Block-Cursor, Stiel und Punkt auf der Position
[marker]
type = "terminal"   # leaflet | terminal
color = "#2848a9"      # Rahmen, Cursor, Stiel
color2 = "#287980"     # Prompt ~/
bg = "#f6f2ee"
fg = "#3d2b5a"
# <<< Marker
