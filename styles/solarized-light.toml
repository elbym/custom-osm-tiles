# Solarized Light: Kartenstil nach dem Editor-Theme Solarized (https://ethanschoonover.com/solarized, MIT).
# Farben aus der Palette des Themes; hell.
title = "Solarized Light"
category = "nerd"      # standard | nerd (Gruppe in der Vorschau)
mode = "light"          # light | dark
family = "Solarized"          # gleiche Familie = Gegenstück beim Hell/Dunkel-Umschalten
font = "JetBrains Mono"
fonts = ["sans", "serif", "mono"]   # Schriftgruppen für --all
text_scale = 1.15
attribution = "Farben nach Solarized (MIT)"
hide = ["poi_r20", "road_oneway*"]

[paint."background"]
background-color = "#fdf6e3"
[paint."landuse-*"]
fill-color = "#eee8d5"
fill-opacity = 1
[paint."park"]
fill-color = "#dfdfaa"
[paint."landcover-*"]
fill-color = "#dfdfaa"
fill-opacity = 1
[paint."landcover-wood"]
fill-color = "#d3d594"
[paint."landuse-cemetery"]
fill-color = "#dfdfaa"

[paint."water*"]
fill-color = "#b2d1dd"
line-color = "#b2d1dd"

[paint."building*"]
fill-color = "#f2ecd9"
fill-outline-color = "#93a1a1"

# Straßen: Füllung zuerst, Ränder danach (später stehende Muster gewinnen)
[paint."*-minor*"]
line-color = "#ffffff"
[paint."*-service-track"]
line-color = "#ffffff"
[paint."*-link"]
line-color = "#ffffff"
[paint."*-secondary-tertiary*"]
line-color = "#ffffff"
[paint."*-primary*"]
line-color = "#e4d094"
[paint."*-trunk*"]
line-color = "#e4d094"
[paint."*-motorway*"]
line-color = "#e6a987"
[paint."*-casing"]
line-color = "#93a1a1"
[paint."*-secondary-tertiary*-casing"]
line-color = "#93a1a1"
[paint."*-primary*-casing"]
line-color = "#c7a439"
[paint."*-trunk*-casing"]
line-color = "#c7a439"
[paint."*-motorway*-casing"]
line-color = "#d26535"
[paint."highway-area"]             # Fußgängerzonen, Plätze
fill-color = "#ffffff"
fill-outline-color = "#ffffff"
[paint."aeroway-*"]
fill-color = "#ffffff"
line-color = "#ffffff"
[paint."*-path"]
line-color = "#93a1a1"
[paint."*railway*"]
line-color = "#839496"
[paint."road_area_pier"]
fill-color = "#fdf6e3"
[paint."road_pier"]
line-color = "#fdf6e3"

[paint."*label*"]
text-color = "#586e75"
text-halo-color = "#ffffff"
[paint."label_*"]
text-color = "#586e75"
text-halo-color = "#ffffff"
[paint."highway-name-*"]
text-color = "#657b83"
text-halo-color = "#ffffff"
[paint."poi_*"]
text-color = "#657b83"
text-halo-color = "#ffffff"
[paint."poi_transit"]
text-color = "#2aa198"
[paint."water*label"]
text-color = "#268bd2"
[paint."airport"]
text-color = "#657b83"
text-halo-color = "#ffffff"

# >>> Akzent-Beschriftung
# Straßennummern ohne weißes Schild (Sprite-Bild, nicht umfärbbar), stattdessen in den Akzentfarben des Themes:
# Autobahn #cb4b16, Bundes-/Hauptstraße #b58900, Land-/Kreisstraße #2aa198. Hauptstraßennamen ebenfalls #b58900.
[layout."*shield*"]
icon-image = ""
text-size = 12
[paint."*shield*"]
text-color = ["match", ["get", "class"], "motorway", "#cb4b16", ["trunk", "primary"], "#b58900", "#2aa198"]
text-halo-color = "#fdf6e3"
text-halo-width = 1.5
[paint."highway-name-major"]
text-color = "#b58900"
# <<< Akzent-Beschriftung

# >>> Marker
# Terminal-Marker: Kästchen "~/<--label>" mit blinkendem Block-Cursor, Stiel und Punkt auf der Position
[marker]
type = "terminal"   # leaflet | terminal
color = "#b58900"      # Rahmen, Cursor, Stiel
color2 = "#2aa198"     # Prompt ~/
bg = "#fdf6e3"
fg = "#586e75"
# <<< Marker
