# "Siebdruck Nacht" (dunkler Partner von Siebdruck, Nutzerwunsch 2026-11-26): Leuchtfarben im Raster auf schwarzem Karton.
#   Gleicher Aufbau wie siebdruck.toml, aber halftone() mit mode = "light": die Platten sind Rot-, Grün- und Blauanteile
#   in Leuchtfarben, die sich aufhellend überlagern (auf Schwarz funktioniert Tinte, die abdunkelt, nicht).
#   Änderungen an Ebenen in beiden Dateien nachziehen.
title = "Siebdruck Nacht"
category = "standard"
mode = "dark"
family = "Siebdruck"
font = "Work Sans"
preview_font = "Fira Sans"   # Schrift für die Vorschau (--all)
site_font = "Work Sans"   # öffentliche Vorschau (--site)
attribution = "Kartenstil: eigener Entwurf nach Schablonen- und Siebdruck"
colors = 64
halftone = { mode = "light", pitch = 6, pitch_step = 1, offset = 1, soft = 0.5, paper = "#16151a" }
text_scale = 1.1
hide = ["poi_r20", "road_oneway*", "highway-shield-*", "road_shield_us", "building-top", "*-casing", "highway-area"]

[paint."background"]
background-color = "#16151a"
[paint."landuse-*"]
fill-color = "#16151a"
fill-opacity = 0
[paint."landuse-cemetery"]
fill-color = "#455f59"
fill-opacity = 1
[paint."park"]
fill-color = "#685d33"
fill-opacity = 1
[paint."landcover-*"]
fill-color = "#534b2c"
fill-opacity = 1
[paint."landcover-wood"]
fill-color = "#547469"
[paint."landcover-sand"]
fill-color = "#4e462b"

[paint."water*"]
fill-color = "#2b6f8d"
line-color = "#2b6f8d"
[paint."building"]
fill-color = "#813364"
fill-outline-color = "#813364"

[paint."highway-*"]
line-color = "#2ec8ff"
[paint."bridge-*"]
line-color = "#2ec8ff"
[paint."tunnel-*"]
line-color = "#286580"
[paint."*-secondary-tertiary"]
line-color = "#2ec8ff"
[paint."*-primary"]
line-color = "#2ec8ff"
[paint."*-trunk*"]
line-color = "#ff48b0"
[paint."*-motorway*"]
line-color = "#ff48b0"
[paint."*-path"]
line-color = "#2ec8ff"
[paint."*railway*"]
line-color = "#963972"
[paint."aeroway-*"]
fill-color = "#16151a"
line-color = "#2ec8ff"
[paint."boundary_*"]
line-color = "#ff48b0"

[paint."label_*"]
text-color = "#ffe14d"
text-halo-color = "#16151a"
[paint."highway-name-*"]
text-color = "#cfe6fa"
text-halo-color = "#16151a"
[paint."poi_*"]
text-color = "#ff8fc6"
text-halo-color = "#16151a"
[paint."water*label"]
text-color = "#8fcaf5"
[layout."label_other"]
text-transform = "uppercase"
text-letter-spacing = 0.2


[marker]
type = "bubble"
color = "#ff48b0"
bg = "#16151a"
fg = "#ffe14d"
