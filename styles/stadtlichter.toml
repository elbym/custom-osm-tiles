# "Stadtlichter": eine Stadt bei Nacht von oben (Nutzerwunsch 2026-11-24, nach einem Nachtfoto einer Großstadt).
# Nicht "Night City" genannt: so heißt die Stadt aus Cyberpunk 2077 (Marke).
#   - fast schwarzer, leicht violetter Grund; Flächen kaum heller, Grün und Wasser nur als dunkle Töne
#   - Straßen leuchten wie Natriumdampflampen, nah dunkler Asphalt mit Lichtspur-Bündeln wie auf Langzeitbelichtungen;
#     in der Übersicht heller Kern, breiter weichgezeichneter Schein
#     (Ränder als Glow); Hauptstraßen und Autobahn fast weißglühend, Nebenstraßen gedämpft orange
#   - Gebäude dunkel mit Fensterraster je Gebäude (fenster-dicht/-spaerlich, nach OSM-ID: halb fast dunkel, sonst warm,
#     jedes sechste kalt); Streulicht-Muster der Wohnflächen nur in der Übersicht bis z14
#   - Sportplätze im Flutlicht grün
title = "Stadtlichter"
category = "standard"
mode = "dark"
family = "Stadtlichter"
order = 60
font = "Fira Sans"
preview_font = "Fira Sans"
site_font = "Fira Sans"
hide = ["poi_r20", "road_oneway*"]
colors = 64   # Lichthöfe der Laternen und Lichtspuren: weiche Verläufe zerfallen bei 32 Farben in Ringe

[paint."background"]
background-color = "#07060d"
[paint."landuse-*"]
fill-color = "#0a0912"
fill-opacity = 1
# Wohn-, Gewerbe- und Industrieflächen: gedämpfte Lichtpunkte, damit die Übersicht (z12–14, noch ohne Nebenstraßen)
# wie ein Lichterteppich wirkt
[paint."landuse-residential"]
fill-pattern = "streulicht"
fill-opacity = ["interpolate", ["linear"], ["zoom"], 13, 1, 15, 0]
[paint."landuse-commercial"]
fill-pattern = "streulicht_kalt"
fill-opacity = ["interpolate", ["linear"], ["zoom"], 13, 1, 15, 0]
[paint."landuse-industrial"]
fill-pattern = "streulicht_gewerbe"
fill-opacity = ["interpolate", ["linear"], ["zoom"], 13, 1, 15, 0]
[paint."landuse-railway"]
fill-color = "#0b0a12"
[paint."park"]
fill-color = "#08100b"
[paint."landcover-*"]
fill-color = "#08100b"
fill-opacity = 1
[paint."landcover-wood"]
fill-color = "#060c08"
[paint."landuse-cemetery"]
fill-color = "#08100b"
[paint."landcover-sand"]
fill-color = "#100e0c"
[paint."landcover-glacier"]
fill-color = "#0e1018"
[paint."landcover-ice-shelf"]
fill-color = "#0e1018"

[paint."water*"]
fill-color = "#030409"
line-color = "#0d1426"

# Gebäude: Seiten fast schwarz, Dächer mit Fensterlichtern
[paint."building"]
fill-color = "#05040a"
[paint."building-top"]
# je Gebäude (OSM-ID) ein Fensterraster: halb fast dunkel, sonst warm belebt, jedes sechste kalt (Büro)
fill-pattern = ["match", ["%", ["floor", ["/", ["to-number", ["id"], 0], 10]], 6], [0, 1, 2], "lichter_spaerlich", 5, "lichter_kalt", "lichter"]
fill-color = "#100d18"
fill-outline-color = "#2a2030"

[paint."highway-area"]   # Plätze und Fußgängerzonen: violetter Schein der Leuchtreklame
fill-color = "#1c0f26"
fill-outline-color = "#5a2a78"
[paint."aeroway-*"]
fill-color = "#14101a"
line-color = "#3a2a20"

# Straßen: Kern hell (nah abgedunkelt, damit die Lichtspuren leuchten), Ränder als Schein (weichgezeichnet, gut doppelt so breit wie die Straße)
[paint."*-service-track"]
line-color = ["interpolate", ["linear"], ["zoom"], 13, "#7a3c18", 15, "#24140e"]
[paint."*-minor*"]
line-color = ["interpolate", ["linear"], ["zoom"], 13, "#b4642a", 15, "#2e1a12"]
[paint."*-link"]
line-color = ["interpolate", ["linear"], ["zoom"], 13, "#ffb860", 15, "#3a2014"]
[paint."*-secondary-tertiary*"]
line-color = ["interpolate", ["linear"], ["zoom"], 13, "#ffc070", 15, "#3a2014"]
[paint."*-primary*"]   # nah: dunkler Asphalt, die Lichtspuren tragen das Licht
line-color = ["interpolate", ["linear"], ["zoom"], 13, "#ffdca0", 15, "#3e2216"]
[paint."*-trunk*"]   # nah: dunkler Asphalt, die Lichtspuren tragen das Licht
line-color = ["interpolate", ["linear"], ["zoom"], 13, "#ffe6bf", 15, "#3e2216"]
[paint."*-motorway*"]   # nah: dunkler Asphalt, die Lichtspuren tragen das Licht
line-color = ["interpolate", ["linear"], ["zoom"], 13, "#fff2dc", 15, "#3e2216"]
[paint."*-path"]
line-color = "#3c2a3a"
[paint."*-casing"]
line-color = "#07060d"
[paint."*-minor-casing"]
line-color = "#a0400f"
line-blur = 4
line-opacity = ["interpolate", ["linear"], ["zoom"], 13, 0.35, 15, 0.17]
line-width = ["interpolate", ["exponential", 1.2], ["zoom"], 12, 1, 14, 8, 20, 32]
[paint."*-service-track-casing"]
line-color = "#6a2a0c"
line-blur = 3
line-opacity = ["interpolate", ["linear"], ["zoom"], 13, 0.4, 15, 0.2]
line-width = ["interpolate", ["exponential", 1.2], ["zoom"], 14, 4, 20, 20]
[paint."*-link-casing"]
line-color = "#e0581a"
line-blur = 5
line-opacity = ["interpolate", ["linear"], ["zoom"], 13, 0.6, 15, 0.3]
line-width = ["interpolate", ["exponential", 1.2], ["zoom"], 12, 2, 14, 9, 20, 34]
[paint."*-secondary-tertiary*-casing"]
line-color = "#e8601a"
line-blur = 6
line-opacity = ["interpolate", ["linear"], ["zoom"], 13, 0.65, 15, 0.33]
line-width = ["interpolate", ["exponential", 1.2], ["zoom"], 8, 3, 14, 12, 20, 40]
[paint."*-primary*-casing"]
line-color = "#ff6a1a"
line-blur = 8
line-opacity = ["interpolate", ["linear"], ["zoom"], 13, 0.7, 15, 0.35]
line-width = ["interpolate", ["exponential", 1.2], ["zoom"], 8, 3, 14, 16, 20, 52]
[paint."*-trunk*-casing"]
line-color = "#ff5a18"
line-blur = 8
line-opacity = ["interpolate", ["linear"], ["zoom"], 13, 0.75, 15, 0.38]
line-width = ["interpolate", ["exponential", 1.2], ["zoom"], 6, 2, 14, 16, 20, 52]
[paint."*-motorway*-casing"]
line-color = "#ff4a1a"
line-blur = 10
line-opacity = ["interpolate", ["linear"], ["zoom"], 13, 0.8, 15, 0.4]
line-width = ["interpolate", ["exponential", 1.2], ["zoom"], 5, 2, 14, 18, 20, 56]
[paint."*railway*"]
line-color = "#2c2440"
[paint."road_area_pier"]
fill-color = "#07060d"
[paint."road_pier"]
line-color = "#07060d"

# Beschriftung warmweiß auf dunklem Rand; POIs im Lichtorange
[paint."*label*"]
text-color = "#efe2cf"
text-halo-color = "#07060d"
[paint."label_*"]
text-color = "#efe2cf"
text-halo-color = "#07060d"
[paint."highway-name-*"]
text-color = "#f4d8b0"
text-halo-color = "#07060d"
text-halo-width = 1.6
[paint."poi_*"]
text-color = "#ffad5c"
text-halo-color = "#07060d"
[paint."water*label"]
text-color = "#5f7cb0"
[paint."airport"]
text-color = "#ffad5c"
text-halo-color = "#07060d"

# Straßennummern ohne weißes Schild, im Licht der Straße
[layout."*shield*"]
icon-image = ""
[paint."*shield*"]
text-color = ["match", ["get", "class"], "motorway", "#fff2dc", ["trunk", "primary"], "#ffdca0", "#ffc070"]
text-halo-color = "#07060d"
text-halo-width = 1.5

[patterns]
lichter = { symbol = "fenster-dicht", color = "#a87840", bg = "#100d18" }
lichter_spaerlich = { symbol = "fenster-spaerlich", color = "#c08a48", bg = "#100d18" }
streulicht = { symbol = "stadtlichter", color = "#9a6a34", bg = "#0b0a13" }
streulicht_gewerbe = { symbol = "stadtlichter", color = "#d08a3a", bg = "#0e0b12" }
streulicht_kalt = { symbol = "stadtlichter", color = "#8fb0ff", bg = "#0b0c16" }
lichter_kalt = { symbol = "fenster-dicht", color = "#7d93b8", bg = "#0e1020" }

# >>> Zusatzebenen (Nutzerwunsch 2026-11-25) ------------------------------------------------------------------------
# Hochhäuser (ab ~6 Geschosse) mit kaltweißen Bürolichtern
[[layers]]
like = "building-top"
id = "building-top-hoch"
filter = [">=", ["get", "render_height"], 18]
paint = { fill-pattern = "lichter_kalt" }

# Sportplätze und Stadien im grünen Flutlicht
[[layers]]
after = "landcover-sand"
id = "flutlicht"
source-layer = "landuse"
filter = ["match", ["get", "class"], ["pitch", "stadium", "track"], true, false]
paint = { fill-color = "#0c2a16" }
[[layers]]
after = "flutlicht"
id = "flutlicht-schein"
type = "line"
source-layer = "landuse"
filter = ["match", ["get", "class"], ["pitch", "stadium", "track"], true, false]
minzoom = 13
paint = { line-color = "#5cff8a", line-blur = 3, line-opacity = 0.45, line-width = ["interpolate", ["linear"], ["zoom"], 13, 1, 16, 4] }

# Fußgängerzonen: violette Neonlinie
[[layers]]
like = "highway-path"
id = "neon-schein"
filter = ["==", ["get", "subclass"], "pedestrian"]
paint = { line-color = "#a040ff", line-blur = ["interpolate", ["exponential", 1.2], ["zoom"], 14, 6, 20, 20], line-opacity = 0.75, line-dasharray = [1, 0], line-width = ["interpolate", ["exponential", 1.2], ["zoom"], 14, 12, 20, 40] }
[[layers]]
like = "highway-path"
after = "neon-schein"
id = "neon"
filter = ["==", ["get", "subclass"], "pedestrian"]
paint = { line-color = "#e9a6ff", line-dasharray = [1, 0], line-width = ["interpolate", ["exponential", 1.2], ["zoom"], 14, 1, 20, 3] }

# Laternen links und rechts der Nebenstraßen (ab Leaflet z15), wie Laternen im Nebel: großer, ganz weicher Lichthof mittig auf
# der Straße, der zu einem Lichtband verschmilzt (nicht versetzt: breit und versetzt zackt er an Knicken), darüber je
# Seite ein engerer Schein, innen ein winziger greller Kern.
# Abstand in Linienbreiten (P / Breite), damit Hof, Schein und Kern auf denselben Stellen liegen
# Lichthof unter den Gebäuden: das Licht bleibt zwischen den Häusern gefangen
[[layers]]
like = "highway-minor"
id = "laterne-hof"
after = "flutlicht-schein"
minzoom = 14
layout = { line-cap = "round", line-join = "round" }
paint = { line-color = "#ffaa30", line-blur = 16, line-opacity = 0.3, line-dasharray = [0, 0.787], line-width = 32 }
# derselbe Hof schwach über Gebäuden und Straße: hellt die Fahrbahn auf und lässt das Licht an den Hauskanten
# leicht überstrahlen (Bloom), zur Hausmitte hin abnehmend
[[layers]]
like = "highway-minor"
id = "laterne-bloom"
after = "highway-minor"
minzoom = 14
layout = { line-cap = "round", line-join = "round" }
paint = { line-color = "#ffaa30", line-blur = 16, line-opacity = 0.12, line-dasharray = [0, 0.787], line-width = 32 }
[[layers]]
like = "highway-minor"
id = "laterne-schein-l"
after = "laterne-bloom"
minzoom = 14
layout = { line-cap = "round", line-join = "round" }
paint = { line-color = "#ffcc58", line-blur = 4.5, line-opacity = 0.22, line-dasharray = [0, 2.8], line-width = 9, line-offset = ["interpolate", ["exponential", 1.2], ["zoom"], 14, -2.5, 16, -4.5, 19, -9] }
[[layers]]
like = "highway-minor"
id = "laterne-schein-r"
after = "laterne-schein-l"
minzoom = 14
layout = { line-cap = "round", line-join = "round" }
paint = { line-color = "#ffcc58", line-blur = 4.5, line-opacity = 0.22, line-dasharray = [0, 2.8], line-width = 9, line-offset = ["interpolate", ["exponential", 1.2], ["zoom"], 14, 2.5, 16, 4.5, 19, 9] }
[[layers]]
like = "highway-minor"
id = "laterne-kern-l"
after = "laterne-schein-r"
minzoom = 14
layout = { line-cap = "round", line-join = "round" }
paint = { line-color = "#fffbea", line-blur = 0.25, line-opacity = 1, line-dasharray = [0, 22.909], line-width = 1.1, line-offset = ["interpolate", ["exponential", 1.2], ["zoom"], 14, -2.5, 16, -4.5, 19, -9] }
[[layers]]
like = "highway-minor"
id = "laterne-kern-r"
after = "laterne-kern-l"
minzoom = 14
layout = { line-cap = "round", line-join = "round" }
paint = { line-color = "#fffbea", line-blur = 0.25, line-opacity = 1, line-dasharray = [0, 22.909], line-width = 1.1, line-offset = ["interpolate", ["exponential", 1.2], ["zoom"], 14, 2.5, 16, 4.5, 19, 9] }

# Lichtspuren wie auf Langzeitbelichtungen (Nutzervorbilder 2026-11-25): auf dunklem Asphalt je Seite ein Bündel
# dünner Streifen, rechts der Linienrichtung Rücklichter (rot, orange, pinkrot), links Scheinwerfer (weiß,
# gelblich, hellblau), darunter je Seite ein weicher Schein; alle Straßen, je kleiner, desto schwächer (Faktor je class)
[[layers]]
after = "bridge-motorway"
id = "lichtspur-rot-schein"
source-layer = "transportation"
minzoom = 12
filter = ["all", ["match", ["geometry-type"], ["LineString", "MultiLineString"], true, false], ["match", ["get", "class"], ["motorway", "trunk", "primary", "secondary", "tertiary", "minor", "service"], true, false], ["!=", ["get", "brunnel"], "tunnel"]]
layout = { line-join = "round", line-cap = "round" }
[layers.paint]
line-color = "#ff2a14"
line-blur = 4
line-opacity = ["*", 0.45, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]]
line-width = ["interpolate", ["exponential", 1.2], ["zoom"], 12, ["*", 3.9, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]], 15, ["*", 6.5, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]], 17, ["*", 9.49, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]], 19, ["*", 13.65, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]]]
line-offset = ["interpolate", ["exponential", 1.2], ["zoom"], 12, ["*", 1.5, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 1, ["secondary", "tertiary"], 0.72, "minor", 0.62, 0.45]], 15, ["*", 2.5, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 1, ["secondary", "tertiary"], 0.72, "minor", 0.62, 0.45]], 17, ["*", 3.65, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 1, ["secondary", "tertiary"], 0.72, "minor", 0.62, 0.45]], 19, ["*", 5.25, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 1, ["secondary", "tertiary"], 0.72, "minor", 0.62, 0.45]]]
[[layers]]
after = "lichtspur-rot-schein"
id = "lichtspur-rot-1"
source-layer = "transportation"
minzoom = 12
filter = ["all", ["match", ["geometry-type"], ["LineString", "MultiLineString"], true, false], ["match", ["get", "class"], ["motorway", "trunk", "primary", "secondary", "tertiary", "minor", "service"], true, false], ["!=", ["get", "brunnel"], "tunnel"]]
layout = { line-join = "round", line-cap = "round" }
[layers.paint]
line-color = "#ff2414"
line-blur = 0.3
line-opacity = ["*", 1, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]]
line-width = ["interpolate", ["exponential", 1.2], ["zoom"], 12, ["*", 1.08, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]], 15, ["*", 1.8, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]], 17, ["*", 2.63, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]], 19, ["*", 3.78, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]]]
line-offset = ["interpolate", ["exponential", 1.2], ["zoom"], 12, ["*", 0.6, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 1, ["secondary", "tertiary"], 0.72, "minor", 0.62, 0.45]], 15, ["*", 1.0, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 1, ["secondary", "tertiary"], 0.72, "minor", 0.62, 0.45]], 17, ["*", 1.46, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 1, ["secondary", "tertiary"], 0.72, "minor", 0.62, 0.45]], 19, ["*", 2.1, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 1, ["secondary", "tertiary"], 0.72, "minor", 0.62, 0.45]]]
[[layers]]
after = "lichtspur-rot-1"
id = "lichtspur-rot-2"
source-layer = "transportation"
minzoom = 12
filter = ["all", ["match", ["geometry-type"], ["LineString", "MultiLineString"], true, false], ["match", ["get", "class"], ["motorway", "trunk", "primary", "secondary", "tertiary", "minor", "service"], true, false], ["!=", ["get", "brunnel"], "tunnel"]]
layout = { line-join = "round", line-cap = "round" }
[layers.paint]
line-color = "#ff7a1a"
line-blur = 0.3
line-opacity = ["*", 0.95, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]]
line-width = ["interpolate", ["exponential", 1.2], ["zoom"], 12, ["*", 0.9, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]], 15, ["*", 1.5, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]], 17, ["*", 2.19, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]], 19, ["*", 3.15, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]]]
line-offset = ["interpolate", ["exponential", 1.2], ["zoom"], 12, ["*", 1.5, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 1, ["secondary", "tertiary"], 0.72, "minor", 0.62, 0.45]], 15, ["*", 2.5, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 1, ["secondary", "tertiary"], 0.72, "minor", 0.62, 0.45]], 17, ["*", 3.65, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 1, ["secondary", "tertiary"], 0.72, "minor", 0.62, 0.45]], 19, ["*", 5.25, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 1, ["secondary", "tertiary"], 0.72, "minor", 0.62, 0.45]]]
[[layers]]
after = "lichtspur-rot-2"
id = "lichtspur-rot-3"
source-layer = "transportation"
minzoom = 12
filter = ["all", ["match", ["geometry-type"], ["LineString", "MultiLineString"], true, false], ["match", ["get", "class"], ["motorway", "trunk", "primary", "secondary", "tertiary", "minor", "service"], true, false], ["!=", ["get", "brunnel"], "tunnel"]]
layout = { line-join = "round", line-cap = "round" }
[layers.paint]
line-color = "#ff2a6a"
line-blur = 0.3
line-opacity = ["*", 0.85, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]]
line-width = ["interpolate", ["exponential", 1.2], ["zoom"], 12, ["*", 0.78, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]], 15, ["*", 1.3, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]], 17, ["*", 1.9, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]], 19, ["*", 2.73, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 0.9, ["secondary", "tertiary"], 0.75, "minor", 0.55, 0.35]]]
line-offset = ["interpolate", ["exponential", 1.2], ["zoom"], 12, ["*", 2.4, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 1, ["secondary", "tertiary"], 0.72, "minor", 0.62, 0.45]], 15, ["*", 4.0, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 1, ["secondary", "tertiary"], 0.72, "minor", 0.62, 0.45]], 17, ["*", 5.84, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 1, ["secondary", "tertiary"], 0.72, "minor", 0.62, 0.45]], 19, ["*", 8.4, ["match", ["get", "class"], ["motorway", "trunk"], 1, "primary", 1, ["secondary", "tertiary"], 0.72, "minor", 0.62, 0.45]]]
[[layers]]
after = "lichtspur-rot-3"
id = "lichtspur-weiss-schein"
source-layer = "transportation"
minzoom = 12
filter = ["all", ["match", ["geometry-type"], ["LineString", "MultiLineString"], true, false], ["match", ["get", "class"], ["motorway", "trunk", "primary", "secondary", "tertiary", "minor", "service"], true, false], ["!=", ["get", "brunnel"], "tunnel"]]
layout = { line-join = "round", line-cap = "round" }
[layers.paint]
line-color = "#fff0d8"
