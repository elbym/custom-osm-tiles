# "Marke" (hell): Markenstil, erzeugt von tools/gen_marke.py aus der Akzentfarbe #6226d9.
#   Grund und Gebäude leicht im Farbton der Marke, Haupt- und Fernstraßen in der Akzentfarbe, Wasser blau, Grün grün;
#   POI-Schrift in der Akzentfarbe mit Kontrast >= 4,5:1, Marker in der unveränderten Kundenfarbe.
#   Erneutes Erzeugen überschreibt diese Datei; Handänderungen also erst nach dem letzten Erzeugen.
title = "Marke"
category = "standard"
mode = "light"
family = "Marke"
font = "Figtree"
preview_font = "Fira Sans"   # Schrift für die Vorschau (--all)
site_font = "Figtree"   # öffentliche Vorschau (--site)
attribution = "Kartenstil: eigener Entwurf (Markenstil aus #6226d9)"
text_scale = 1.15
hide = ["poi_r20", "road_oneway*"]

[paint."background"]
background-color = "#f1f1f8"
[paint."landuse-*"]
fill-color = "#e9e9f0"
fill-opacity = 1
[paint."landuse-cemetery"]
fill-color = "#b8e1b8"
[paint."park"]
fill-color = "#b8e1b8"
[paint."landcover-*"]
fill-color = "#b8e1b8"
fill-opacity = 1
[paint."landcover-wood"]
fill-color = "#a7d6a8"
[paint."landcover-sand"]
fill-color = "#e9e9f0"
[paint."water*"]
fill-color = "#9fcbe6"
line-color = "#9fcbe6"
[paint."building*"]
fill-color = "#dcdbe7"
fill-outline-color = "#c7c6d2"

[paint."*-minor*"]
line-color = "#ffffff"
[paint."*-service-track"]
line-color = "#ffffff"
[paint."*-secondary-tertiary*"]
line-color = "#ffffff"
[paint."*-link"]
line-color = "#ffffff"
[paint."*-primary*"]
line-color = "#dad8fe"
[paint."*-trunk*"]
line-color = "#dad8fe"
[paint."*-motorway*"]
line-color = "#c5bffe"
[paint."*-casing"]
line-color = "#c7c6ce"
[paint."*-primary*-casing"]
line-color = "#a398f3"
[paint."*-trunk*-casing"]
line-color = "#a398f3"
[paint."*-motorway*-casing"]
line-color = "#7264ba"
[paint."*-path"]
line-color = "#a6a5ac"
[paint."*railway*"]
line-color = "#737379"
[paint."highway-area"]
fill-color = "#e9e9f0"
fill-outline-color = "#c7c6ce"
[paint."aeroway-*"]
fill-color = "#e9e9f0"
line-color = "#ffffff"

[paint."label_*"]
text-color = "#1e1d26"
text-halo-color = "#ffffff"
[paint."highway-name-*"]
text-color = "#424248"
text-halo-color = "#ffffff"
[paint."poi_*"]
text-color = "#6226d9"
text-halo-color = "#ffffff"
[paint."water*label"]
text-color = "#1a5b82"
text-halo-color = "#ffffff"

[marker]
type = "bubble"
color = "#6226d9"
bg = "#ffffff"
fg = "#1e1d26"
