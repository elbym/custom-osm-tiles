# Dracula: Kartenstil nach dem Editor-Theme Dracula (https://draculatheme.com, MIT).
# Farben aus der Palette des Themes; dunkel.
title = "Dracula"
category = "nerd"      # standard | nerd (Gruppe in der Vorschau)
mode = "dark"          # light | dark
family = "Dracula"          # gleiche Familie = Gegenstück beim Hell/Dunkel-Umschalten
font = "Fira Sans"
preview_font = "Maple Mono"   # Schrift für die Vorschau (--all)
fonts = ["sans", "serif", "mono"]   # Schriftgruppen für --all
text_scale = 1.15
attribution = "Farben nach Dracula (MIT)"
hide = ["poi_r20", "road_oneway*"]

# Neon (Dracula, Tokyo Night, Cyberpunk): Haupt-/Fernstraßen und Autobahn fast in voller Akzentfarbe, ihre Ränder
# in derselben Farbe weichgezeichnet (line-blur) als Leuchtschein. Markiert mit "# Neon".
# Charakter: viele kräftige Farben nebeneinander. Autobahn Pink, Haupt-/Fernstraße Lila, Land-/Kreisstraße
# Orange (75 % Mix), Fußwege Grün (50 % Mix), Wasser Cyan; Nebenstraßen direkt in Comment (#6272a4).
[paint."background"]
background-color = "#282a36"
[paint."landuse-*"]
fill-color = "#242631"
fill-opacity = 1
# Grünflächen in der Signaturfarbe des Themes: Lila (#bd93f9), mit dem Grund gemischt
[paint."park"]
fill-color = "#463f5d"
[paint."landcover-*"]
fill-color = "#463f5d"
fill-opacity = 1
[paint."landcover-wood"]
fill-color = "#52476d"
[paint."landuse-cemetery"]
fill-color = "#463f5d"

# Wasser in Dracula-Cyan (#8be9fd), 55 % mit dem Grund gemischt; Flüsse 65 %
[paint."water*"]
fill-color = "#5e93a3"
line-color = "#68a6b7"

[paint."building*"]
fill-color = "#363848"
fill-outline-color = "#44475a"

# Straßen: Füllung zuerst, Ränder danach (später stehende Muster gewinnen)
[paint."*-minor*"]
line-color = "#6272a4"
[paint."*-service-track"]
line-color = "#6272a4"
[paint."*-link"]
line-color = "#6272a4"
[paint."*-secondary-tertiary*"]
line-color = "#c9945e"
[paint."*-primary*"]
line-color = "#ae88e6"   # Neon
[paint."*-trunk*"]
line-color = "#ae88e6"   # Neon
[paint."*-motorway*"]
line-color = "#f475bf"   # Neon
[paint."*-casing"]
line-color = "#191a21"
[paint."*-secondary-tertiary*-casing"]
line-color = "#191a21"
[paint."*-primary*-casing"]
line-color = "#bd93f9"   # Neon-Leuchtschein
line-blur = 3
line-opacity = 0.55
[paint."*-trunk*-casing"]
line-color = "#bd93f9"   # Neon-Leuchtschein
line-blur = 3
line-opacity = 0.55
[paint."*-motorway*-casing"]
line-color = "#ff79c6"   # Neon-Leuchtschein
line-blur = 4
line-opacity = 0.6
[paint."highway-area"]             # Fußgängerzonen, Plätze
fill-color = "#44475a"
fill-outline-color = "#44475a"
[paint."aeroway-*"]
fill-color = "#44475a"
line-color = "#44475a"
[paint."*-path"]
line-color = "#3c9258"
[paint."*railway*"]
line-color = "#44475a"
[paint."road_area_pier"]
fill-color = "#282a36"
[paint."road_pier"]
line-color = "#282a36"

# Orts- und POI-Namen in der Akzentfarbe des Markers (#ff79c6, mit Text/Grund gemischt für Kontrast)
[paint."*label*"]
text-color = "#ff79c6"
text-halo-color = "#282a36"
[paint."label_*"]
text-color = "#ff79c6"
text-halo-color = "#282a36"
[paint."highway-name-*"]
text-color = "#e2e2dc"
text-halo-color = "#282a36"
[paint."poi_*"]
text-color = "#d068a6"
text-halo-color = "#282a36"
[paint."poi_transit"]
text-color = "#8be9fd"
[paint."water*label"]
text-color = "#8be9fd"
[paint."airport"]
text-color = "#d068a6"
text-halo-color = "#282a36"

# >>> Akzent-Beschriftung
# Straßennummern ohne weißes Schild (Sprite-Bild, nicht umfärbbar), stattdessen in den Akzentfarben des Themes:
# Autobahn #ff79c6, Bundes-/Hauptstraße #bd93f9, Land-/Kreisstraße #ffb86c. Hauptstraßennamen ebenfalls #bd93f9.
[layout."*shield*"]
icon-image = ""
text-size = 12
[paint."*shield*"]
text-color = ["match", ["get", "class"], "motorway", "#ff79c6", ["trunk", "primary"], "#bd93f9", "#ffb86c"]
text-halo-color = "#282a36"
text-halo-width = 1.5
[paint."highway-name-major"]
text-color = "#bd93f9"
# <<< Akzent-Beschriftung

# >>> Marker
# Terminal-Marker: Kästchen "~/<--label>" mit blinkendem Block-Cursor, Stiel und Punkt auf der Position
[marker]
type = "terminal"   # leaflet | terminal
color = "#ff79c6"      # Rahmen, Cursor, Stiel
color2 = "#bd93f9"     # Prompt ~/
bg = "#282a36"
fg = "#f8f8f2"
# <<< Marker
