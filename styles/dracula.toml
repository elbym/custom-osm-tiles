# Dracula: Kartenstil nach dem Editor-Theme Dracula (https://draculatheme.com, MIT).
# Farben aus der Palette des Themes; dunkel.
title = "Dracula"
category = "nerd"      # standard | nerd (Gruppe in der Vorschau)
mode = "dark"          # light | dark
family = "Dracula"          # gleiche Familie = Gegenstück beim Hell/Dunkel-Umschalten
font = "Fira Sans"
preview_font = "Maple Mono"   # Schrift für die Vorschau (--all)
fonts = ["sans", "serif", "mono"]   # Schriftgruppen für --all
text_scale = 1.15
attribution = "Farben nach Dracula (MIT)"
hide = ["poi_r20", "road_oneway*"]

# Neon (dunkle Nerd-Stile): Haupt-/Fernstraßen und Autobahn fast in voller Akzentfarbe, ihre Ränder
# in derselben Farbe weichgezeichnet (line-blur) als Leuchtschein; Wasser leuchtender. Markiert mit "# Neon".
[paint."background"]
background-color = "#282a36"
[paint."landuse-*"]
fill-color = "#242631"
fill-opacity = 1
# Grünflächen in der Signaturfarbe des Themes: Lila (#bd93f9), mit dem Grund gemischt
[paint."park"]
fill-color = "#463f5d"
[paint."landcover-*"]
fill-color = "#463f5d"
fill-opacity = 1
[paint."landcover-wood"]
fill-color = "#52476d"
[paint."landuse-cemetery"]
fill-color = "#463f5d"

[paint."water*"]
fill-color = "#5a8a9a"   # Neon
line-color = "#639dad"

[paint."building*"]
fill-color = "#363848"
fill-outline-color = "#44475a"

# Straßen: Füllung zuerst, Ränder danach (später stehende Muster gewinnen)
[paint."*-minor*"]
line-color = "#535c7f"
[paint."*-service-track"]
line-color = "#535c7f"
[paint."*-link"]
line-color = "#535c7f"
[paint."*-secondary-tertiary*"]
line-color = "#5a6792"
[paint."*-primary*"]
line-color = "#ae88e6"   # Neon
[paint."*-trunk*"]
line-color = "#ae88e6"   # Neon
[paint."*-motorway*"]
line-color = "#f475bf"   # Neon
[paint."*-casing"]
line-color = "#191a21"
[paint."*-secondary-tertiary*-casing"]
line-color = "#191a21"
[paint."*-primary*-casing"]
line-color = "#bd93f9"   # Neon-Leuchtschein
line-blur = 3
line-opacity = 0.55
[paint."*-trunk*-casing"]
line-color = "#bd93f9"   # Neon-Leuchtschein
line-blur = 3
line-opacity = 0.55
[paint."*-motorway*-casing"]
line-color = "#ff79c6"   # Neon-Leuchtschein
line-blur = 4
line-opacity = 0.6
[paint."highway-area"]             # Fußgängerzonen, Plätze
fill-color = "#44475a"
fill-outline-color = "#44475a"
[paint."aeroway-*"]
fill-color = "#44475a"
line-color = "#44475a"
[paint."*-path"]
line-color = "#6272a4"
[paint."*railway*"]
line-color = "#6272a4"
[paint."road_area_pier"]
fill-color = "#282a36"
[paint."road_pier"]
line-color = "#282a36"

[paint."*label*"]
text-color = "#f8f8f2"
text-halo-color = "#282a36"
[paint."label_*"]
text-color = "#f8f8f2"
text-halo-color = "#282a36"
[paint."highway-name-*"]
text-color = "#e2e2dc"
text-halo-color = "#282a36"
[paint."poi_*"]
text-color = "#bfbfb8"
text-halo-color = "#282a36"
[paint."poi_transit"]
text-color = "#8be9fd"
[paint."water*label"]
text-color = "#8be9fd"
[paint."airport"]
text-color = "#bfbfb8"
text-halo-color = "#282a36"

# >>> Akzent-Beschriftung
# Straßennummern ohne weißes Schild (Sprite-Bild, nicht umfärbbar), stattdessen in den Akzentfarben des Themes:
# Autobahn #ff79c6, Bundes-/Hauptstraße #bd93f9, Land-/Kreisstraße #8be9fd. Hauptstraßennamen ebenfalls #bd93f9.
[layout."*shield*"]
icon-image = ""
text-size = 12
[paint."*shield*"]
text-color = ["match", ["get", "class"], "motorway", "#ff79c6", ["trunk", "primary"], "#bd93f9", "#8be9fd"]
text-halo-color = "#282a36"
text-halo-width = 1.5
[paint."highway-name-major"]
text-color = "#bd93f9"
# <<< Akzent-Beschriftung

# >>> Marker
# Terminal-Marker: Kästchen "~/<--label>" mit blinkendem Block-Cursor, Stiel und Punkt auf der Position
[marker]
type = "terminal"   # leaflet | terminal
color = "#ff79c6"      # Rahmen, Cursor, Stiel
color2 = "#bd93f9"     # Prompt ~/
bg = "#282a36"
fg = "#f8f8f2"
# <<< Marker
