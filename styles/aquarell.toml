# "Aquarell" (Nutzerwunsch 2026-11-26, zweiter Anlauf "deutlich mehr wie Stamen Watercolor"): Karte in Wasserfarben.
#   Nach dem Vorbild von Stamen Watercolor (eigene Umsetzung, nur der Look): MapLibre zeichnet nur einfache Farbflächen
#   ohne Ränder; die Wasserfarbe entsteht erst in watercolor() (make-tiles.py) aus den Pixeln jeder Kachel samt Nachbarn:
#   ausgefranste Ränder (warp), Pigment sammelt sich an den Flächenrändern (edge), fleckiger Auftrag (wash), Körnung
#   (grain) und Papier (paper); alles Rauschen weltfest, daher nahtlos. Die Beschriftung wird getrennt gerendert und
#   danach scharf obenauf gelegt. Palette wie dort: Ocker-Land, kräftiges Blau, Gelbgrün, helle Straßen ohne Ränder.
#   colors = 64, sonst stufen die Verläufe.
title = "Aquarell"
category = "standard"
mode = "light"
family = "Aquarell"
font = "Alegreya Sans"
preview_font = "Fira Sans"   # Schrift für die Vorschau (--all)
site_font = "Alegreya Sans"   # öffentliche Vorschau (--site)
attribution = "Kartenstil: eigener Entwurf nach dem Vorbild von Stamen Watercolor"
colors = 64
watercolor = { warp = 3, warp_scale = 30, soft = 0.7, edge_width = 3, edge = 1.4, wash = 0.35, wash_scale = 160, grain = 0.6, paper = 0.06, drops = 0.1, drop_size = [0.15, 0.5] }
text_scale = 1.15
hide = ["poi_r20", "road_oneway*", "highway-shield-*", "road_shield_us", "building-top", "*-casing", "aeroway-*-casing"]

[paint."background"]
background-color = "#f1e5c8"
[paint."landuse-*"]
fill-color = "#e9d5b0"
fill-opacity = 1
[paint."landuse-commercial"]
fill-color = "#e6d0b4"
[paint."landuse-industrial"]
fill-color = "#e6d0b4"
[paint."landuse-cemetery"]
fill-color = "#b9d394"
[paint."park"]
fill-color = "#b9d394"
fill-opacity = 1
[paint."landcover-*"]
fill-color = "#b9d394"
fill-opacity = 1
fill-outline-color = "#b9d394"
[paint."landcover-wood"]
fill-color = "#9cc07a"
fill-outline-color = "#9cc07a"
[paint."landcover-sand"]
fill-color = "#ecd9a4"
fill-outline-color = "#ecd9a4"
[paint."water*"]
fill-color = "#86b6de"
line-color = "#86b6de"
[paint."building"]
fill-color = "#e2c6a6"
fill-outline-color = "#e2c6a6"
fill-opacity = 0.7

# Straßen hell ohne Ränder; den Rand malt der Pigmentsaum in watercolor()
[paint."highway-*"]
line-color = "#fdf9ef"
[paint."bridge-*"]
line-color = "#fdf9ef"
[paint."tunnel-*"]
line-color = "#fdf9ef"
[paint."*-primary"]
line-color = "#fbf1d6"
[paint."*-trunk*"]
line-color = "#fbf1d6"
[paint."*-motorway*"]
line-color = "#f7e0b8"
[paint."highway-area"]
fill-color = "#fdf9ef"
fill-outline-color = "#fdf9ef"
[paint."aeroway-*"]
fill-color = "#e9d5b0"
line-color = "#fdf9ef"
[paint."*-path"]
line-color = "#b39f85"
[paint."*railway*"]
line-color = "#a08c72"
[paint."boundary_*"]
line-color = "#b39f85"

[paint."label_*"]
text-color = "#3e4a5c"
text-halo-color = "#f6eedb"
[paint."highway-name-*"]
text-color = "#5a4c40"
text-halo-color = "#f6eedb"
[paint."poi_*"]
text-color = "#8a5a3a"
text-halo-color = "#f6eedb"
[paint."water*label"]
text-color = "#2f628c"
text-halo-color = "#f6eedb"

[marker]
type = "bubble"
color = "#c8553d"
bg = "#fbf6ea"
fg = "#3e4a5c"
