# "Siebdruck" (Nutzerwunsch 2026-11-26): Plakat im Druckraster auf Naturpapier.
#   - Die Karte hat nur flache Farben; das Raster entsteht in halftone() (make-tiles.py): jede Farbe in Cyan, Magenta,
#     Gelb und Schwarz zerlegt, je Farbe ein Punktraster unter eigenem Winkel (Gelb 0°, Cyan 15°, Schwarz 45°,
#     Magenta 75°, daher Rosetten), Punktgröße nach Farbmenge, Platten je 1 px versetzt (Passer), übereinander gedruckt
#     (Grün = Cyan- über Gelbpunkten). Rasterweite 6 px bei z17, je Stufe darunter 1 px feiner.
#   - Flächen in hellen Tönen (lockere Punkte), Straßen in voller Druckfarbe (ab ~100 % volle Fläche, bleiben durchgehend)
#   - Beschriftung getrennt gerendert und scharf obenauf; Ortsteile in Versalien, gesperrt
title = "Siebdruck"
category = "standard"
mode = "light"
family = "Siebdruck"
font = "Work Sans"
preview_font = "Fira Sans"   # Schrift für die Vorschau (--all)
site_font = "Work Sans"   # öffentliche Vorschau (--site)
attribution = "Kartenstil: eigener Entwurf nach Schablonen- und Siebdruck"
colors = 64
halftone = { pitch = 6, pitch_step = 1, offset = 1, soft = 0.5, paper = "#f5efe3" }
text_scale = 1.1
hide = ["poi_r20", "road_oneway*", "highway-shield-*", "road_shield_us", "building-top", "*-casing", "highway-area"]

[paint."background"]
background-color = "#f5efe3"
[paint."landuse-*"]
fill-color = "#f5efe3"
fill-opacity = 0
[paint."landuse-cemetery"]
fill-color = "#1fd10e"
fill-opacity = 1
[paint."park"]
fill-color = "#fae905"
fill-opacity = 1
[paint."landcover-*"]
fill-color = "#f9eb0e"
fill-opacity = 1
[paint."landcover-wood"]
fill-color = "#0bc404"
[paint."landcover-sand"]
fill-color = "#f9d41c"

[paint."water*"]
fill-color = "#08c5e1"
line-color = "#08c5e1"
[paint."building"]
fill-color = "#f983c4"
fill-outline-color = "#f983c4"

[paint."highway-*"]
line-color = "#00a3e0"
[paint."bridge-*"]
line-color = "#00a3e0"
[paint."tunnel-*"]
line-color = "#0bc9e2"
[paint."*-secondary-tertiary"]
line-color = "#00a3e0"
[paint."*-primary"]
line-color = "#00a3e0"
[paint."*-trunk*"]
line-color = "#ff3fa4"
[paint."*-motorway*"]
line-color = "#ff3fa4"
[paint."*-path"]
line-color = "#00a3e0"
[paint."*railway*"]
line-color = "#013100"
[paint."aeroway-*"]
fill-color = "#f5efe3"
line-color = "#6fadde"
[paint."boundary_*"]
line-color = "#ff48b0"

[paint."label_*"]
text-color = "#004f8c"
text-halo-color = "#f5efe3"
[paint."highway-name-*"]
text-color = "#004f8c"
text-halo-color = "#f5efe3"
[paint."poi_*"]
text-color = "#b8236f"
text-halo-color = "#f5efe3"
[paint."water*label"]
text-color = "#004f8c"
[layout."label_other"]
text-transform = "uppercase"
text-letter-spacing = 0.2


[marker]
type = "bubble"
color = "#ff48b0"
bg = "#f5efe3"
fg = "#004f8c"
