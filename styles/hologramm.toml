paint = { line-color = "#3fc8ff", line-width = ["interpolate", ["linear"], ["zoom"], 14, 0.4, 16, 0.9], line-opacity = 0.7, line-translate = ["interpolate", ["linear"], ["zoom"], 14, ["literal", [0, 0]], 15, ["literal", [0.6, -1.6]], 17, ["literal", [1.0, -2.0]]] }
