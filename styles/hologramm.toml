# "Hologramm" (Entwurf, Nutzerwunsch 2026-11-26): die Stadt als Volumen-Hologramm über einer Projektionsplatte, dunkel:
#   - Grund fast schwarz, leicht violett, mit Messraster ("+"-Marken, Muster holoraster) statt Bluecrons durchgehendem Gitter
#   - Gebäude als Stapel aus bis zu 6 Leuchtumrissen (Stockwerk-Scheiben) nach render_height, je Scheibe nach oben rechts
#     versetzt, Farbe von Cyan unten nach Magenta oben, oberste Scheibe je Gebäude mit fast weißem Deckel
#   - Glitch: Grundriss zusätzlich in Magenta 1 px nach links (chromatische Aberration)
#   - Straßen zurückhaltend in gedämpftem Cyan, nur die Autobahn mit Leuchtschein
#   - Unterschied zu Bluecron: violetter Grund, Raster aus Marken, Gebäude als Volumen statt Drahtgitter-Dach
title = "Hologramm"
category = "nerd"
mode = "dark"
family = "Hologramm"
order = 96
font = "Maple Mono"
preview_font = "Maple Mono"
site_font = "Maple Mono"
fonts = ["sans", "mono"]
text_scale = 1.05
colors = 64   # irisierende Scheiben: bei 32 Palettenfarben fielen Pfirsich, Mint und Violett weg
hide = ["poi_r20", "road_oneway*", "building-top"]

[paint."background"]
background-pattern = "holoraster"
background-color = "#07060f"
[paint."landuse-*"]
fill-color = "#07060f"
fill-opacity = 0
[paint."park"]
fill-color = "#0a2a2a"
fill-opacity = 0.5
[paint."landcover-*"]
fill-color = "#0a2a2a"
fill-opacity = 0.5
[paint."landuse-cemetery"]
fill-color = "#0a2a2a"
fill-opacity = 0.5

[paint."water*"]
fill-color = "#04030a"
line-color = "#1f6f8a"

# Grundriss selbst nur als dunkler Schatten auf der Platte, die Scheiben (unten) tragen das Licht
[paint."building"]
fill-color = "#0c0a1c"
fill-outline-color = "#0c0a1c"

# Straßen: gedämpftes Cyan, keine Konturen; Autobahn Magenta mit Schein
[paint."*-minor*"]
line-color = "#1c4756"
[paint."*-service-track"]
line-color = "#16343f"
[paint."*-link"]
line-color = "#2a6f86"
[paint."*-secondary-tertiary*"]
line-color = "#2a6f86"
[paint."*-primary*"]
line-color = "#3aa3c2"
[paint."*-trunk*"]
line-color = "#3aa3c2"
[paint."*-motorway*"]
line-color = "#ff5ce1"
[paint."*-casing"]
line-opacity = 0
[paint."*-motorway*-casing"]
line-color = "#ff5ce1"
line-blur = 4
line-opacity = 0.5
[paint."highway-area"]
fill-color = "#0e0c22"
fill-outline-color = "#2a6f86"
[paint."aeroway-*"]
fill-color = "#0e0c22"
line-color = "#0e0c22"
[paint."*-path"]
line-color = "#2a4f66"
[paint."*railway*"]
line-color = "#3b3560"
[paint."road_area_pier"]
fill-color = "#07060f"
[paint."road_pier"]
line-color = "#07060f"

# Beschriftung: Versalien, Cyan, harter dunkler Halo; POIs in der Markerfarbe
[layout."label_*"]
text-transform = "uppercase"
text-letter-spacing = 0.15
[paint."label_*"]
text-color = "#bff6ff"
text-halo-color = "#07060f"
text-halo-width = 2
text-halo-blur = 0
[paint."highway-name-*"]
text-color = "#7fd8ec"
text-halo-color = "#07060f"
[paint."poi_*"]
text-color = "#4fe3ff"
text-halo-color = "#07060f"
[paint."airport"]
text-color = "#4fe3ff"
text-halo-color = "#07060f"
[paint."water*label"]
text-color = "#3aa3c2"

[marker]
type = "terminal"
color = "#4fe3ff"
color2 = "#ff5ce1"
bg = "#07060f"
fg = "#e6fcff"

[patterns]
holoraster = { symbol = "holoraster", color = "#2a3a66", bg = "#07060f" }

# >>> Hologramm-Scheiben: erzeugt von tools/gen_holo.py (nicht von Hand bearbeiten, dort ändern und neu erzeugen).
# 6 Schwellen render_height, Gebäude per OSM-ID und Höhe in 3 Gruppen mit eigener Neigung, Farbe und Linienart, flackernde Scheiben,
# Neon-Deckel ab 12 m, Glitch-Band bei jedem 7. Hochhaus. holo-glitch: Grundriss in Magenta 1 px nach links (Aberration).
[[layers]]
source-layer = "building"
like = "building"
type = "line"
after = "building"
id = "holo-glitch"
minzoom = 13
paint = { line-color = "#ff3fd0", line-width = ["interpolate", ["linear"], ["zoom"], 14, 0.4, 16, 0.9], line-opacity = 0.55, line-translate = ["interpolate", ["linear"], ["zoom"], 14, ["literal", [0, 0]], 15, ["literal", [-1, 0]]] }
[[layers]]
source-layer = "building"
like = "building"
type = "fill"
after = "holo-glitch"
id = "holo-0-0"
filter = ["all", ["==", ["%", ["+", ["floor", ["/", ["to-number", ["id"], 0], 10]], ["floor", ["coalesce", ["get", "render_height"], 0]]], 3], 0], [">=", ["coalesce", ["get", "render_height"], 0], 0]]
