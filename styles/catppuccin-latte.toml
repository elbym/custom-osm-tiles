# Catppuccin Latte: Kartenstil nach dem Editor-Theme Catppuccin (https://catppuccin.com, MIT).
# Farben aus der Palette des Themes; hell.
title = "Catppuccin Latte"
category = "nerd"      # standard | nerd (Gruppe in der Vorschau)
mode = "light"          # light | dark
family = "Catppuccin"          # gleiche Familie = Gegenstück beim Hell/Dunkel-Umschalten
font = "Fira Sans"
preview_font = "Maple Mono"   # Schrift für die Vorschau (--all)
site_font = "Fantasque Sans Mono"   # öffentliche Vorschau (--site); ohne: Schrift der Gruppe aus site.toml
fonts = ["sans", "serif", "mono"]   # Schriftgruppen für --all
text_scale = 1.15
attribution = "Farben nach Catppuccin (MIT)"
hide = ["poi_r20", "road_oneway*"]

[paint."background"]
background-color = "#eff1f5"
[paint."landuse-*"]
fill-color = "#e6e9ef"
fill-opacity = 1
# Grünflächen in der Signaturfarbe des Themes: Peach (#fe640b), mit dem Grund gemischt
[paint."park"]
fill-color = "#f3ceba"
[paint."landcover-*"]
fill-color = "#f3ceba"
fill-opacity = 1
[paint."landcover-wood"]
fill-color = "#f4c0a3"
[paint."landuse-cemetery"]
fill-color = "#f3ceba"

[paint."water*"]
fill-color = "#a7d4df"
line-color = "#a7d4df"

[paint."building*"]
fill-color = "#d6dae2"
fill-outline-color = "#bcc0cc"

# Straßen: Füllung zuerst, Ränder danach (später stehende Muster gewinnen)
[paint."*-minor*"]
line-color = "#ffffff"
[paint."*-service-track"]
line-color = "#ffffff"
[paint."*-link"]
line-color = "#ffffff"
[paint."*-secondary-tertiary*"]
line-color = "#ffffff"
[paint."*-primary*"]
line-color = "#e9cea9"
[paint."*-trunk*"]
line-color = "#e9cea9"
[paint."*-motorway*"]
line-color = "#f6b28c"
[paint."*-casing"]
line-color = "#bcc0cc"
[paint."*-secondary-tertiary*-casing"]
line-color = "#9ca0b0"
[paint."*-primary*-casing"]
line-color = "#e3a753"
[paint."*-trunk*-casing"]
line-color = "#e3a753"
[paint."*-motorway*-casing"]
line-color = "#fc792e"
[paint."highway-area"]             # Fußgängerzonen, Plätze
fill-color = "#ffffff"
fill-outline-color = "#ffffff"
[paint."aeroway-*"]
fill-color = "#ffffff"
line-color = "#ffffff"
[paint."*-path"]
line-color = "#9ca0b0"
[paint."*railway*"]
line-color = "#8c8fa1"
[paint."road_area_pier"]
fill-color = "#eff1f5"
[paint."road_pier"]
line-color = "#eff1f5"

# Orts- und POI-Namen in der Akzentfarbe des Markers (#8839ef, mit Text/Grund gemischt für Kontrast)
[paint."*label*"]
text-color = "#8839ef"
text-halo-color = "#ffffff"
[paint."label_*"]
text-color = "#8839ef"
text-halo-color = "#ffffff"
[paint."highway-name-*"]
text-color = "#5c5f77"
text-halo-color = "#ffffff"
[paint."poi_*"]
text-color = "#7341c0"
text-halo-color = "#ffffff"
[paint."poi_transit"]
text-color = "#1e66f5"
[paint."water*label"]
text-color = "#209fb5"
[paint."airport"]
text-color = "#7341c0"
text-halo-color = "#ffffff"

# >>> Akzent-Beschriftung
# Straßennummern ohne weißes Schild (Sprite-Bild, nicht umfärbbar), stattdessen in den Akzentfarben des Themes:
# Autobahn #fe640b, Bundes-/Hauptstraße #8839ef, Land-/Kreisstraße #179299. Hauptstraßennamen ebenfalls #8839ef.
[layout."*shield*"]
icon-image = ""
text-size = 12
[paint."*shield*"]
text-color = ["match", ["get", "class"], "motorway", "#fe640b", ["trunk", "primary"], "#8839ef", "#179299"]
text-halo-color = "#eff1f5"
text-halo-width = 1.5
[paint."highway-name-major"]
text-color = "#8839ef"
# <<< Akzent-Beschriftung

# >>> Marker
# Terminal-Marker: Kästchen "~/<--label>" mit blinkendem Block-Cursor, Stiel und Punkt auf der Position
[marker]
type = "terminal"   # leaflet | terminal
color = "#8839ef"      # Rahmen, Cursor, Stiel
color2 = "#fe640b"     # Prompt ~/
bg = "#eff1f5"
fg = "#4c4f69"
# <<< Marker
