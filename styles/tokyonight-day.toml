# Tokyo Night Day: Kartenstil nach dem Editor-Theme Tokyo Night (https://github.com/folke/tokyonight.nvim, Apache-2.0).
# Farben aus der Palette des Themes; hell.
title = "Tokyo Night Day"
category = "nerd"      # standard | nerd (Gruppe in der Vorschau)
mode = "light"          # light | dark
family = "Tokyo Night"          # gleiche Familie = Gegenstück beim Hell/Dunkel-Umschalten
font = "JetBrains Mono"
preview_font = "Maple Mono"   # Schrift für die Vorschau (--all)
fonts = ["sans", "serif", "mono"]   # Schriftgruppen für --all
text_scale = 1.15
attribution = "Farben nach Tokyo Night (Apache-2.0)"
hide = ["poi_r20", "road_oneway*"]

[paint."background"]
background-color = "#e1e2e7"
[paint."landuse-*"]
fill-color = "#d0d5e3"
fill-opacity = 1
# Grünflächen in der Signaturfarbe des Themes: Neon-Pink (#d20065), mit dem Grund gemischt
[paint."park"]
fill-color = "#ddaac6"
[paint."landcover-*"]
fill-color = "#ddaac6"
fill-opacity = 1
[paint."landcover-wood"]
fill-color = "#dc93ba"
[paint."landuse-cemetery"]
fill-color = "#ddaac6"

[paint."water*"]
fill-color = "#a2bfe8"
line-color = "#a2bfe8"

[paint."building*"]
fill-color = "#cdd0de"
fill-outline-color = "#a8aecb"

# Straßen: Füllung zuerst, Ränder danach (später stehende Muster gewinnen)
[paint."*-minor*"]
line-color = "#ffffff"
[paint."*-service-track"]
line-color = "#ffffff"
[paint."*-link"]
line-color = "#ffffff"
[paint."*-secondary-tertiary*"]
line-color = "#ffffff"
[paint."*-primary*"]
line-color = "#c3b9ac"
[paint."*-trunk*"]
line-color = "#c3b9ac"
[paint."*-motorway*"]
line-color = "#c0a2ec"
[paint."*-casing"]
line-color = "#a8aecb"
[paint."*-secondary-tertiary*-casing"]
line-color = "#8990b3"
[paint."*-primary*-casing"]
line-color = "#a18a68"
[paint."*-trunk*-casing"]
line-color = "#a18a68"
[paint."*-motorway*-casing"]
line-color = "#a369f0"
[paint."highway-area"]             # Fußgängerzonen, Plätze
fill-color = "#ffffff"
fill-outline-color = "#ffffff"
[paint."aeroway-*"]
fill-color = "#ffffff"
line-color = "#ffffff"
[paint."*-path"]
line-color = "#8990b3"
[paint."*railway*"]
line-color = "#848cb5"
[paint."road_area_pier"]
fill-color = "#e1e2e7"
[paint."road_pier"]
line-color = "#e1e2e7"

[paint."*label*"]
text-color = "#3760bf"
text-halo-color = "#ffffff"
[paint."label_*"]
text-color = "#3760bf"
text-halo-color = "#ffffff"
[paint."highway-name-*"]
text-color = "#6172b0"
text-halo-color = "#ffffff"
[paint."poi_*"]
text-color = "#68709a"
text-halo-color = "#ffffff"
[paint."poi_transit"]
text-color = "#007197"
[paint."water*label"]
text-color = "#2e7de9"
[paint."airport"]
text-color = "#68709a"
text-halo-color = "#ffffff"

# >>> Akzent-Beschriftung
# Straßennummern ohne weißes Schild (Sprite-Bild, nicht umfärbbar), stattdessen in den Akzentfarben des Themes:
# Autobahn #b15c00, Bundes-/Hauptstraße #9854f1, Land-/Kreisstraße #007197. Hauptstraßennamen ebenfalls #9854f1.
[layout."*shield*"]
icon-image = ""
text-size = 12
[paint."*shield*"]
text-color = ["match", ["get", "class"], "motorway", "#b15c00", ["trunk", "primary"], "#9854f1", "#007197"]
text-halo-color = "#e1e2e7"
text-halo-width = 1.5
[paint."highway-name-major"]
text-color = "#9854f1"
# <<< Akzent-Beschriftung

# >>> Marker
# Terminal-Marker: Kästchen "~/<--label>" mit blinkendem Block-Cursor, Stiel und Punkt auf der Position
[marker]
type = "terminal"   # leaflet | terminal
color = "#9854f1"      # Rahmen, Cursor, Stiel
color2 = "#2e7de9"     # Prompt ~/
bg = "#e1e2e7"
fg = "#3760bf"
# <<< Marker
