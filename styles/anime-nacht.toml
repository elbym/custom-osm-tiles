line-width = ["interpolate", ["exponential", 1.4], ["zoom"], 14, 0, 16, 7, 20, 24]
line-dasharray = [0.28, 0.5]
[[layers]]
like = "bridge-railway"
after = "bridge-railway-hatching"
id = "bridge-railway-schiene-l"
minzoom = 14.5
paint = { line-color = "#c8c8e8", line-width = ["interpolate", ["exponential", 1.4], ["zoom"], 14, 0.5, 16, 1.2, 20, 3.5], line-offset = ["interpolate", ["exponential", 1.4], ["zoom"], 14.5, 0, 16, -1.8, 20, -6] }
[[layers]]
like = "bridge-railway"
after = "bridge-railway-schiene-l"
