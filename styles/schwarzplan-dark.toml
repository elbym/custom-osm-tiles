# "Weißplan" (dunkler Partner von Schwarzplan, Nutzerwunsch 2026-11-26): derselbe Figur-Grund-Plan umgekehrt,
#   knochenweiße Gebäude auf Anthrazit (kein reines Schwarz/Weiß, Nutzerwunsch 2026-11-26; Kontrast 11,5:1 statt 15:1),
#   Wasser dunkles Schiefergrau, Marker in Signalrot.
#   Gleicher Aufbau wie schwarzplan.toml (Begründungen dort), nur die Farben getauscht; Änderungen in beiden nachziehen.
title = "Weißplan"
category = "standard"
mode = "dark"
family = "Schwarzplan"
font = "TeX Gyre Heros"
preview_font = "Fira Sans"   # Schrift für die Vorschau (--all)
site_font = "TeX Gyre Heros"   # öffentliche Vorschau (--site)
attribution = "Kartenstil: eigener Entwurf nach dem Schwarzplan der Stadtplanung"
hide = ["highway-area", "highway-*casing", "highway-motorway*", "highway-link", "highway-minor", "highway-secondary-tertiary",
        "highway-primary", "highway-trunk", "highway-path", "highway-shield-*", "highway-name-path", "road_*",
        "bridge-*", "tunnel-*", "*railway*", "ferry", "aeroway-*", "cablecar*", "boundary_*", "airport", "poi_*",
        "park", "landcover-*", "landuse-cemetery", "landuse-hospital", "landuse-school", "landuse-railway", "landuse-suburb",
        "building-top", "waterway_tunnel", "waterway_line_label", "water_name_*"]

[paint."background"]
background-color = "#24262a"
# Siedlungsflächen nur, solange es noch keine Gebäude gibt
[paint."landuse-*"]
fill-color = "#e4e0d6"
fill-opacity = ["interpolate", ["linear"], ["zoom"], 10, 0.7, 12, 0.45, 13, 0]
[paint."water*"]
fill-color = "#363d44"
line-color = "#363d44"
[paint."building"]
fill-color = "#e4e0d6"
fill-outline-color = "#e4e0d6"
fill-opacity = 1

[paint."label_*"]
text-color = "#e4e0d6"
text-halo-color = "#24262a"
[paint."highway-name-*"]
text-color = "#8f8c85"
text-halo-color = "#24262a"
[paint."poi_*"]
text-color = "#aaaaaa"   # unsichtbar (poi_* aus), nur für die Symbolfarben im Sprite

[marker]
type = "bubble"
color = "#e0301e"
bg = "#24262a"
fg = "#e4e0d6"
