# Farben wie die bekannte OSM-Standardkarte. Eigene Umsetzung, inspiriert von
# OSM OpenMapTiles (https://openmaptiles.org/styles/osm-openmaptiles/),
# Farbwerte nach openstreetmap-carto (CC0).
title = "OSM OpenMapTiles (nachempfunden)"
font = "Overpass"
text_scale = 1.15
attribution = "Stil inspiriert von OSM OpenMapTiles / openstreetmap-carto"

[paint."background"]
background-color = "#f2efe9"

[paint."landuse-residential"]
fill-color = "#e0dfdf"
fill-opacity = 1
[paint."landuse-commercial"]
fill-color = "#f2dad9"
[paint."landuse-industrial"]
fill-color = "#ebdbe8"
[paint."landuse-cemetery"]
fill-color = "#aacbaf"
[paint."landuse-hospital"]
fill-color = "#ffffe5"
[paint."landuse-school"]
fill-color = "#ffffe5"
[paint."park"]
fill-color = "#c8facc"
[paint."landcover-wood"]
fill-color = "#add19e"
fill-opacity = 1
[paint."landcover-grass*"]
fill-color = "#cdebb0"

[paint."water*"]
fill-color = "#aad3df"
line-color = "#aad3df"

[paint."building*"]
fill-color = "#d9d0c9"
fill-outline-color = "#c4b6ab"

[paint."*-minor*"]
line-color = "#ffffff"
[paint."*-minor*-casing"]
line-color = "#bbbbbb"
[paint."*-secondary-tertiary*"]
line-color = "#f7fabf"
[paint."*-secondary-tertiary*-casing"]
line-color = "#707d05"
[paint."*-primary*"]
line-color = "#fcd6a4"
[paint."*-primary*-casing"]
line-color = "#a06b00"
[paint."*-trunk*"]
line-color = "#f9b29c"
[paint."*-trunk*-casing"]
line-color = "#c84e2f"
[paint."*-motorway*"]
line-color = "#e892a2"
[paint."*-motorway*-casing"]
line-color = "#dc2a67"
[paint."*-path*"]
line-color = "#fa8072"
[paint."*railway*"]
line-color = "#707070"

[paint."label_*"]
text-color = "#000000"
[paint."highway-name-*"]
text-color = "#222222"
text-halo-color = "#ffffff"
[paint."water*label"]
text-color = "#4d80b3"
