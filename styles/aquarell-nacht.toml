# "Aquarell Nacht" (dunkler Partner von Aquarell, Nutzerwunsch 2026-11-26): Wasserfarben auf Indigo.
#   Nach dem Vorbild von Stamen Watercolor (eigene Umsetzung, nur der Look): MapLibre zeichnet nur einfache Farbflächen
#   ohne Ränder; die Wasserfarbe entsteht erst in watercolor() (make-tiles.py) aus den Pixeln jeder Kachel samt Nachbarn:
#   ausgefranste Ränder (warp), Pigment sammelt sich an den Flächenrändern (edge), fleckiger Auftrag (wash), Körnung
#   (grain) und Papier (paper); alles Rauschen weltfest, daher nahtlos. Die Beschriftung wird getrennt gerendert und
#   danach scharf obenauf gelegt. Palette wie dort: Ocker-Land, kräftiges Blau, Gelbgrün, helle Straßen ohne Ränder.
#   colors = 64, sonst stufen die Verläufe.
title = "Aquarell Nacht"
category = "standard"
mode = "dark"
family = "Aquarell"
font = "Caveat"
preview_font = "Fira Sans"   # Schrift für die Vorschau (--all)
site_font = "Caveat"   # öffentliche Vorschau (--site)
attribution = "Kartenstil: eigener Entwurf nach dem Vorbild von Stamen Watercolor"
colors = 64
watercolor = { warp = 3, warp_scale = 30, soft = 0.7, edge_width = 3, edge = 0.5, wash = 0.25, wash_scale = 160, grain = 0.35, paper = 0.03, drops = 0.1, drop_size = [0.15, 0.5], drop_out = 0.45 }
text_scale = 1.15
hide = ["poi_r20", "road_oneway*", "highway-shield-*", "road_shield_us", "building-top", "*-casing", "aeroway-*-casing"]

[paint."background"]
background-color = "#232a3c"
[paint."landuse-*"]
fill-color = "#283046"
fill-opacity = 1
[paint."landuse-commercial"]
fill-color = "#2c3249"
[paint."landuse-industrial"]
fill-color = "#2c3249"
[paint."landuse-cemetery"]
fill-color = "#3b5c43"
[paint."park"]
fill-color = "#3b5c43"
fill-opacity = 1
[paint."landcover-*"]
fill-color = "#3b5c43"
fill-opacity = 1
fill-outline-color = "#3b5c43"
[paint."landcover-wood"]
fill-color = "#335441"
fill-outline-color = "#335441"
[paint."landcover-sand"]
fill-color = "#4a4532"
fill-outline-color = "#4a4532"
[paint."water*"]
fill-color = "#33618a"
line-color = "#33618a"
[paint."building"]
fill-color = "#3a3d55"
fill-outline-color = "#3a3d55"
fill-opacity = 0.7

# Straßen hell ohne Ränder; den Rand malt der Pigmentsaum in watercolor()
[paint."highway-*"]
line-color = "#535b78"
[paint."bridge-*"]
line-color = "#535b78"
[paint."tunnel-*"]
line-color = "#535b78"
[paint."*-primary"]
line-color = "#8a7856"
[paint."*-trunk*"]
line-color = "#8a7856"
[paint."*-motorway*"]
line-color = "#9a6f55"
[paint."highway-area"]
fill-color = "#535b78"
fill-outline-color = "#535b78"
[paint."aeroway-*"]
fill-color = "#283046"
line-color = "#535b78"
[paint."*-path"]
line-color = "#6a7090"
[paint."*railway*"]
line-color = "#6a7090"
[paint."boundary_*"]
line-color = "#6a7090"

[paint."label_*"]
text-color = "#efe6d4"
text-halo-color = "#1d2333"
[paint."highway-name-*"]
text-color = "#d6ccba"
text-halo-color = "#1d2333"
[paint."poi_*"]
text-color = "#e0bc92"
text-halo-color = "#1d2333"
[paint."water*label"]
text-color = "#a8cbe8"
text-halo-color = "#1d2333"

[marker]
type = "bubble"
color = "#e08a6a"
bg = "#232a3c"
fg = "#efe6d4"
