# Firefox: Standard-Stil mit den Farben der Firefox-Entwicklerwerkzeuge (Photon, wie "Firefox DevTools"
# Light in der Nerd-Gruppe), aber neutrale Beschriftung, Straßenschilder und Blasen-Marker; Schrift Fira Sans.
title = "Firefox"
category = "standard"      # standard | nerd (Gruppe in der Vorschau)
mode = "light"          # light | dark
family = "Firefox"          # gleiche Familie = Gegenstück beim Hell/Dunkel-Umschalten
font = "Fira Sans"
preview_font = "Fira Sans"   # Schrift für die Vorschau (--all)
site_font = "Fira Sans"   # Fira: ursprünglich für Mozilla entworfen
text_scale = 1.15
attribution = "Farben nach Firefox DevTools / Photon (MPL-2.0)"
hide = ["poi_r20", "road_oneway*"]

# Charakter: nüchternes Photon-Grau (grey-10 als Grund) mit kräftigem Firefox-Blau für Hauptstraßen, Orange für die
# Autobahn, weiße Nebenstraßen mit grey-30-Rand. Grün highlight-green, Wasser blue-55, beide mit dem Grund gemischt.
[paint."background"]
background-color = "#f9f9fa"   # grey-10
[paint."landuse-*"]
fill-color = "#f2f2f4"
fill-opacity = 1
# Grünflächen in highlight-green (#058b00), 25 % mit dem Grund gemischt (Wald 35 %)
[paint."park"]
fill-color = "#bcdebc"
[paint."landcover-*"]
fill-color = "#bcdebc"
fill-opacity = 1
[paint."landcover-wood"]
fill-color = "#a4d2a3"
[paint."landuse-cemetery"]
fill-color = "#bcdebc"

# Wasser in blue-55 (#0074e8), 25 % mit dem Grund gemischt; Flüsse 35 %
[paint."water*"]
fill-color = "#bbd8f6"
line-color = "#a2caf4"

[paint."building*"]
fill-color = "#e0e0e2"   # grey-25
fill-outline-color = "#d7d7db"   # grey-30

[paint."*-minor*"]
line-color = "#ffffff"
[paint."*-service-track"]
line-color = "#ffffff"
[paint."*-link"]
line-color = "#ffffff"
[paint."*-secondary-tertiary*"]
line-color = "#b9dcff"   # toolbar-background-highlighted
[paint."*-primary*"]
line-color = "#0074e8"   # blue-55
[paint."*-trunk*"]
line-color = "#0074e8"
[paint."*-motorway*"]
line-color = "#f13c00"   # highlight-orange
[paint."*-casing"]
line-color = "#d7d7db"   # grey-30
[paint."*-secondary-tertiary*-casing"]
line-color = "#5e88b0"
[paint."*-primary*-casing"]
line-color = "#003eaa"   # blue-70
[paint."*-trunk*-casing"]
line-color = "#003eaa"
[paint."*-motorway*-casing"]
line-color = "#a4000f"   # red-70
[paint."highway-area"]             # Fußgängerzonen, Plätze
fill-color = "#ffffff"
fill-outline-color = "#d7d7db"
[paint."aeroway-*"]
fill-color = "#ededf0"
line-color = "#ededf0"
[paint."*-path"]
line-color = "#737373"   # grey-50
[paint."*railway*"]
line-color = "#939395"   # grey-45
[paint."road_area_pier"]
fill-color = "#f9f9fa"
[paint."road_pier"]
line-color = "#f9f9fa"

# Ortsnamen in Photon grey-70, Straßennamen grey-60, POIs und Wasser in der Markerfarbe (#0060df, Kontrast 5,6:1)
[paint."label_*"]
text-color = "#38383d"
text-halo-color = "#f9f9fa"
[paint."highway-name-*"]
text-color = "#4a4a4f"
text-halo-color = "#f9f9fa"
[paint."poi_*"]
text-color = "#0060df"
text-halo-color = "#f9f9fa"
[paint."poi_transit"]
text-color = "#058b00"
[paint."water*label"]
text-color = "#0060df"
[paint."airport"]
text-color = "#0060df"
text-halo-color = "#f9f9fa"

# >>> Marker
# Blasen-Marker: Label im abgerundeten Kasten, Stiel und Punkt auf der Position
[marker]
type = "bubble"     # leaflet | bubble | terminal
color = "#0060df"     # Rahmen, Stiel, Punkt
bg = "#ffffff"         # Kasten
fg = "#0c0c0d"         # Schrift
# <<< Marker
